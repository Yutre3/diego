<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
  </marker>
  <style>
    .t{font-family:Arial,sans-serif;fill:#222}.title{font-size:28px;font-weight:700}.label{font-size:20px}.small{font-size:16px}
    .line{stroke:#333;stroke-width:2.5;fill:none}
    .dash{stroke:#333;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
    .uc{fill:white;stroke:#333;stroke-width:2.5}
  </style>
</defs>
<rect width="1000" height="720" fill="white"/>
<text x="500" y="42" text-anchor="middle" class="t title">Casos de uso principales - Hotel Duerme Bien</text>

<circle cx="125" cy="270" r="24" fill="white" stroke="#333" stroke-width="2.5"/>
<line x1="125" y1="294" x2="125" y2="370" class="line"/>
<line x1="75" y1="320" x2="175" y2="320" class="line"/>
<line x1="125" y1="370" x2="85" y2="430" class="line"/>
<line x1="125" y1="370" x2="165" y2="430" class="line"/>
<text x="125" y="465" text-anchor="middle" class="t label">Encargado de hotel</text>

<rect x="280" y="90" width="650" height="560" fill="white" stroke="#333" stroke-width="2.5"/>
<text x="310" y="125" class="t label" font-weight="700">Sistema de Pasajeros</text>

<ellipse cx="500" cy="220" rx="130" ry="48" class="uc"/>
<text x="500" y="227" text-anchor="middle" class="t label">Registrar Check-in</text>

<ellipse cx="500" cy="390" rx="130" ry="48" class="uc"/>
<text x="500" y="397" text-anchor="middle" class="t label">Registrar Check-out</text>

<ellipse cx="790" cy="220" rx="125" ry="44" class="uc"/>
<text x="790" y="227" text-anchor="middle" class="t label">Asignar habitación</text>

<ellipse cx="790" cy="500" rx="115" ry="44" class="uc"/>
<text x="790" y="507" text-anchor="middle" class="t label">Calcular costo</text>

<line x1="175" y1="315" x2="370" y2="230" class="line"/>
<line x1="175" y1="340" x2="370" y2="390" class="line"/>

<path d="M630 220 L665 220" class="dash"/>
<text x="648" y="196" text-anchor="middle" class="t small">&lt;&lt;include&gt;&gt;</text>

<path d="M620 420 C690 435 745 455 770 458" class="dash"/>
<text x="704" y="438" class="t small">&lt;&lt;include&gt;&gt;</text>

<text x="320" y="605" class="t small">Registrar Check-in incluye Asignar habitación.</text>
<text x="320" y="632" class="t small">Registrar Check-out incluye Calcular costo.</text>
</svg>