<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
  </marker>
  <style>
    .t{font-family:Arial,sans-serif;fill:#222}
    .title{font-size:28px;font-weight:700}.label{font-size:20px}.small{font-size:16px}
    .line{stroke:#333;stroke-width:2.5;fill:none}
    .dash{stroke:#333;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
    .uc{fill:white;stroke:#333;stroke-width:2.5}
  </style>
</defs>
<rect width="980" height="720" fill="white"/>
<text x="490" y="42" text-anchor="middle" class="t title">Casos de uso principales - Hotel Duerme Bien</text>

<!-- actor -->
<circle cx="125" cy="270" r="24" fill="white" stroke="#333" stroke-width="2.5"/>
<line x1="125" y1="294" x2="125" y2="370" class="line"/>
<line x1="75" y1="320" x2="175" y2="320" class="line"/>
<line x1="125" y1="370" x2="85" y2="430" class="line"/>
<line x1="125" y1="370" x2="165" y2="430" class="line"/>
<text x="125" y="465" text-anchor="middle" class="t label">Encargado de hotel</text>

<!-- system boundary -->
<rect x="280" y="90" width="620" height="560" fill="white" stroke="#333" stroke-width="2.5"/>
<text x="310" y="125" class="t label" font-weight="700">Sistema de Pasajeros</text>

<ellipse cx="535" cy="215" rx="150" ry="48" class="uc"/>
<text x="535" y="222" text-anchor="middle" class="t label">Registrar Check-in</text>

<ellipse cx="535" cy="365" rx="150" ry="48" class="uc"/>
<text x="535" y="372" text-anchor="middle" class="t label">Registrar Check-out</text>

<ellipse cx="745" cy="520" rx="120" ry="44" class="uc"/>
<text x="745" y="527" text-anchor="middle" class="t label">Calcular costo</text>

<ellipse cx="745" cy="215" rx="125" ry="44" class="uc"/>
<text x="745" y="222" text-anchor="middle" class="t label">Asignar habitación</text>

<line x1="175" y1="315" x2="385" y2="225" class="line"/>
<line x1="175" y1="340" x2="385" y2="365" class="line"/>

<path d="M675 215 L620 215" class="dash"/>
<text x="650" y="192" text-anchor="middle" class="t small">&lt;&lt;include&gt;&gt;</text>

<path d="M670 395 C710 420 735 460 742 476" class="dash"/>
<text x="720" y="438" class="t small">&lt;&lt;include&gt;&gt;</text>

<text x="320" y="620" class="t small">El check-in incluye la asignación de habitación.</text>
<text x="320" y="645" class="t small">El check-out incluye el cálculo del costo.</text>
</svg>