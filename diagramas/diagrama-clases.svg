<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
<defs>
  <marker id="tri" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
    <path d="M0,0 L0,10 L10,5 z" fill="white" stroke="#444" stroke-width="1.5"/>
  </marker>
  <style>
    .t{font-family:Arial,sans-serif;fill:#222}.title{font-size:28px;font-weight:700}
    .h{font-size:19px;font-weight:700}.f{font-size:14px}
    .box{fill:#eef2ff;stroke:#4d5fb8;stroke-width:2}.box2{fill:#eef8f2;stroke:#4d8f67;stroke-width:2}
    .box3{fill:#fff3e8;stroke:#b4773f;stroke-width:2}
    .sep{stroke:#555;stroke-width:1.5}.rel{stroke:#555;stroke-width:2;fill:none}
    .inh{stroke:#555;stroke-width:2;fill:none;marker-end:url(#tri)}
  </style>
</defs>
<rect width="1500" height="1050" fill="white"/>
<text x="750" y="42" text-anchor="middle" class="t title">Diagrama de clases - Sistema de Pasajeros</text>

<!-- Usuario -->
<rect x="570" y="90" width="360" height="235" class="box"/>
<line x1="570" y1="135" x2="930" y2="135" class="sep"/><line x1="570" y1="240" x2="930" y2="240" class="sep"/>
<text x="750" y="119" text-anchor="middle" class="t h">Usuario</text>
<text x="590" y="160" class="t f">- idUsuario: int</text><text x="590" y="182" class="t f">- nombre: string</text><text x="590" y="204" class="t f">- username: string</text><text x="590" y="226" class="t f">- rol: string</text>
<text x="590" y="266" class="t f">+ iniciarSesion(): boolean</text><text x="590" y="290" class="t f">+ cerrarSesion(): void</text>

<!-- Administrador -->
<rect x="225" y="405" width="330" height="185" class="box"/>
<line x1="225" y1="450" x2="555" y2="450" class="sep"/><line x1="225" y1="505" x2="555" y2="505" class="sep"/>
<text x="390" y="434" text-anchor="middle" class="t h">Administrador</text>
<text x="245" y="478" class="t f">- permisosAdministracion: string</text>
<text x="245" y="532" class="t f">+ gestionarUsuarios(): void</text><text x="245" y="556" class="t f">+ gestionarHabitaciones(): void</text><text x="245" y="580" class="t f">+ generarInforme(): void</text>

<!-- Encargado -->
<rect x="945" y="405" width="350" height="210" class="box"/>
<line x1="945" y1="450" x2="1295" y2="450" class="sep"/><line x1="945" y1="505" x2="1295" y2="505" class="sep"/>
<text x="1120" y="434" text-anchor="middle" class="t h">EncargadoHotel</text>
<text x="965" y="478" class="t f">- turno: string</text>
<text x="965" y="532" class="t f">+ registrarHuesped(): void</text><text x="965" y="556" class="t f">+ gestionarReserva(): void</text><text x="965" y="580" class="t f">+ realizarCheckIn(): void</text><text x="965" y="604" class="t f">+ realizarCheckOut(): void</text>

<path d="M390 405 L390 355 L675 355 L675 325" class="inh"/>
<path d="M1120 405 L1120 355 L825 355 L825 325" class="inh"/>

<!-- Huesped -->
<rect x="60" y="700" width="300" height="210" class="box2"/>
<line x1="60" y1="745" x2="360" y2="745" class="sep"/><line x1="60" y1="850" x2="360" y2="850" class="sep"/>
<text x="210" y="730" text-anchor="middle" class="t h">Huesped</text>
<text x="80" y="770" class="t f">- idHuesped: int</text><text x="80" y="792" class="t f">- documento: string</text><text x="80" y="814" class="t f">- nombre: string</text><text x="80" y="836" class="t f">- apellido: string</text>
<text x="80" y="878" class="t f">+ actualizarDatos(): void</text>

<!-- Habitacion -->
<rect x="420" y="700" width="330" height="235" class="box2"/>
<line x1="420" y1="745" x2="750" y2="745" class="sep"/><line x1="420" y1="865" x2="750" y2="865" class="sep"/>
<text x="585" y="730" text-anchor="middle" class="t h">Habitacion</text>
<text x="440" y="770" class="t f">- idHabitacion: int</text><text x="440" y="792" class="t f">- numero: string</text><text x="440" y="814" class="t f">- capacidad: int</text><text x="440" y="836" class="t f">- orientacion: string</text><text x="440" y="858" class="t f">- estado: string</text>
<text x="440" y="894" class="t f">+ estaDisponible(): boolean</text><text x="440" y="918" class="t f">+ cambiarEstado(): void</text>

<!-- Reserva -->
<rect x="820" y="700" width="300" height="235" class="box3"/>
<line x1="820" y1="745" x2="1120" y2="745" class="sep"/><line x1="820" y1="865" x2="1120" y2="865" class="sep"/>
<text x="970" y="730" text-anchor="middle" class="t h">Reserva</text>
<text x="840" y="770" class="t f">- idReserva: int</text><text x="840" y="792" class="t f">- fechaEntrada: date</text><text x="840" y="814" class="t f">- fechaSalida: date</text><text x="840" y="836" class="t f">- estado: string</text>
<text x="840" y="892" class="t f">+ crear(): void</text><text x="840" y="914" class="t f">+ modificar(): void</text><text x="840" y="936" class="t f">+ cancelar(): void</text>

<!-- Estadia -->
<rect x="1180" y="700" width="280" height="235" class="box3"/>
<line x1="1180" y1="745" x2="1460" y2="745" class="sep"/><line x1="1180" y1="865" x2="1460" y2="865" class="sep"/>
<text x="1320" y="730" text-anchor="middle" class="t h">Estadia</text>
<text x="1200" y="770" class="t f">- idEstadia: int</text><text x="1200" y="792" class="t f">- checkIn: datetime</text><text x="1200" y="814" class="t f">- checkOut: datetime</text><text x="1200" y="836" class="t f">- totalCalculado: decimal</text>
<text x="1200" y="892" class="t f">+ calcularCosto(): decimal</text><text x="1200" y="914" class="t f">+ finalizar(): void</text>

<!-- associations -->
<line x1="360" y1="805" x2="420" y2="805" class="rel"/><text x="365" y="790" class="t f">0..*</text><text x="395" y="825" class="t f">1..*</text>
<line x1="750" y1="790" x2="820" y2="790" class="rel"/><text x="760" y="775" class="t f">1</text><text x="790" y="810" class="t f">0..*</text>
<line x1="750" y1="865" x2="1180" y2="865" class="rel"/><text x="765" y="850" class="t f">1</text><text x="1130" y="850" class="t f">0..*</text>
<line x1="1120" y1="805" x2="1180" y2="805" class="rel"/><text x="1125" y="790" class="t f">0..1</text><text x="1155" y="825" class="t f">1</text>

<path d="M1120 615 L1120 660 L970 660 L970 700" class="rel"/><text x="980" y="650" class="t f">gestiona 0..*</text>
<path d="M1120 615 L1120 675 L1320 675 L1320 700" class="rel"/><text x="1205" y="664" class="t f">registra 0..*</text>

<text x="60" y="1005" class="t f">Estructura tomada del formato UML de clase: nombre, atributos y operaciones, con multiplicidades entre clases.</text>
</svg>