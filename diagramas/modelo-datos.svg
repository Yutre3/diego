<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050">
<defs>
<style>
.t{font-family:Arial,sans-serif;fill:#222}.title{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.f{font-size:14px}.note{font-size:15px}
.box{fill:#fff;stroke:#333;stroke-width:2}.head{fill:#f0f0f0;stroke:#333;stroke-width:2}.relbox{fill:#f8fbfd;stroke:#9aaab3;stroke-width:1.5}
</style>
</defs>
<rect width="1400" height="1050" fill="white"/>
<text x="700" y="38" text-anchor="middle" class="t title">Modelo de base de datos - Hotel Duerme Bien</text>

<!-- Top entities -->
<rect x="70" y="90" width="300" height="205" rx="7" class="box"/>
<rect x="70" y="90" width="300" height="42" rx="7" class="head"/>
<text x="220" y="117" text-anchor="middle" class="t h">Usuario</text>
<text x="92" y="160" class="t f">PK id_usuario</text>
<text x="92" y="185" class="t f">nombre</text>
<text x="92" y="210" class="t f">username</text>
<text x="92" y="235" class="t f">password_hash</text>
<text x="92" y="260" class="t f">rol, activo</text>

<rect x="550" y="90" width="300" height="230" rx="7" class="box"/>
<rect x="550" y="90" width="300" height="42" rx="7" class="head"/>
<text x="700" y="117" text-anchor="middle" class="t h">Habitación</text>
<text x="572" y="160" class="t f">PK id_habitacion</text>
<text x="572" y="185" class="t f">numero *</text>
<text x="572" y="210" class="t f">capacidad</text>
<text x="572" y="235" class="t f">orientacion</text>
<text x="572" y="260" class="t f">estado *</text>
<text x="572" y="285" class="t f">valor_pasajero *</text>

<rect x="1030" y="90" width="300" height="230" rx="7" class="box"/>
<rect x="1030" y="90" width="300" height="42" rx="7" class="head"/>
<text x="1180" y="117" text-anchor="middle" class="t h">Huésped</text>
<text x="1052" y="160" class="t f">PK id_huesped</text>
<text x="1052" y="185" class="t f">documento *</text>
<text x="1052" y="210" class="t f">nombre *</text>
<text x="1052" y="235" class="t f">apellido *</text>
<text x="1052" y="260" class="t f">telefono *</text>
<text x="1052" y="285" class="t f">email *</text>

<!-- Middle entities -->
<rect x="230" y="400" width="360" height="255" rx="7" class="box"/>
<rect x="230" y="400" width="360" height="42" rx="7" class="head"/>
<text x="410" y="427" text-anchor="middle" class="t h">Reserva</text>
<text x="252" y="470" class="t f">PK id_reserva</text>
<text x="252" y="495" class="t f">FK id_habitacion</text>
<text x="252" y="520" class="t f">FK id_usuario_creador</text>
<text x="252" y="545" class="t f">fecha_entrada *</text>
<text x="252" y="570" class="t f">fecha_salida *</text>
<text x="252" y="595" class="t f">estado *</text>
<text x="252" y="620" class="t f">fecha_creacion</text>

<rect x="810" y="400" width="360" height="280" rx="7" class="box"/>
<rect x="810" y="400" width="360" height="42" rx="7" class="head"/>
<text x="990" y="427" text-anchor="middle" class="t h">Estadía</text>
<text x="832" y="470" class="t f">PK id_estadia</text>
<text x="832" y="495" class="t f">FK id_reserva (opcional)</text>
<text x="832" y="520" class="t f">FK id_habitacion</text>
<text x="832" y="545" class="t f">FK id_usuario_registro</text>
<text x="832" y="570" class="t f">checkin</text>
<text x="832" y="595" class="t f">checkout</text>
<text x="832" y="620" class="t f">total_calculado</text>
<text x="832" y="645" class="t f">estado</text>

<!-- Junctions -->
<rect x="230" y="760" width="360" height="120" rx="7" class="box"/>
<rect x="230" y="760" width="360" height="42" rx="7" class="head"/>
<text x="410" y="787" text-anchor="middle" class="t h">Reserva_Huésped</text>
<text x="252" y="830" class="t f">PK/FK id_reserva</text>
<text x="252" y="855" class="t f">PK/FK id_huesped</text>

<rect x="810" y="760" width="360" height="120" rx="7" class="box"/>
<rect x="810" y="760" width="360" height="42" rx="7" class="head"/>
<text x="990" y="787" text-anchor="middle" class="t h">Estadía_Huésped</text>
<text x="832" y="830" class="t f">PK/FK id_estadia</text>
<text x="832" y="855" class="t f">PK/FK id_huesped</text>

<!-- Relationship summary instead of crossing arrows -->
<rect x="70" y="920" width="1260" height="90" rx="8" class="relbox"/>
<text x="90" y="948" class="t note" font-weight="700">Relaciones principales</text>
<text x="90" y="976" class="t note">Usuario 1 — N Reserva   |   Usuario 1 — N Estadía   |   Habitación 1 — N Reserva   |   Habitación 1 — N Estadía</text>
<text x="90" y="1001" class="t note">Reserva N — N Huésped mediante Reserva_Huésped   |   Estadía N — N Huésped mediante Estadía_Huésped</text>

<!-- Local, non-crossing relation guides -->
<line x1="220" y1="295" x2="360" y2="400" stroke="#666" stroke-width="2"/>
<text x="248" y="340" class="t f">1 : N</text>

<line x1="650" y1="320" x2="500" y2="400" stroke="#666" stroke-width="2"/>
<text x="558" y="350" class="t f">1 : N</text>

<line x1="750" y1="320" x2="900" y2="400" stroke="#666" stroke-width="2"/>
<text x="810" y="350" class="t f">1 : N</text>

<line x1="410" y1="655" x2="410" y2="760" stroke="#666" stroke-width="2"/>
<text x="425" y="715" class="t f">1 : N</text>

<line x1="990" y1="680" x2="990" y2="760" stroke="#666" stroke-width="2"/>
<text x="1005" y="725" class="t f">1 : N</text>

<line x1="1180" y1="320" x2="1180" y2="900" stroke="#aaa" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="1180" y1="840" x2="1170" y2="840" stroke="#666" stroke-width="2"/>
<line x1="1180" y1="820" x2="1170" y2="820" stroke="#666" stroke-width="2"/>
<text x="1192" y="575" class="t f">Huésped se relaciona con ambas tablas puente</text>

<text x="70" y="1035" class="t f">* Campo o valor propuesto que debe validarse porque el Caso 6 no lo define de forma exacta.</text>
</svg>