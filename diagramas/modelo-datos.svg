<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<defs>
<style>.t{font-family:Arial,sans-serif;fill:#222}.title{font-size:26px;font-weight:700}.h{font-size:18px;font-weight:700}.f{font-size:14px}.box{fill:white;stroke:#333;stroke-width:2}.line{stroke:#555;stroke-width:2;fill:none}</style>
</defs>
<rect width="1400" height="980" fill="white"/>
<text x="700" y="38" text-anchor="middle" class="t title">Modelo de datos - Hotel Duerme Bien</text>

<!-- Usuario -->
<rect x="70" y="100" width="270" height="190" rx="6" class="box"/>
<rect x="70" y="100" width="270" height="40" rx="6" fill="#eee" stroke="#333" stroke-width="2"/>
<text x="205" y="126" text-anchor="middle" class="t h">Usuario</text>
<text x="90" y="165" class="t f">PK id_usuario</text><text x="90" y="190" class="t f">nombre</text><text x="90" y="215" class="t f">username</text><text x="90" y="240" class="t f">password_hash</text><text x="90" y="265" class="t f">rol, activo</text>

<!-- Habitacion -->
<rect x="565" y="100" width="270" height="200" rx="6" class="box"/>
<rect x="565" y="100" width="270" height="40" rx="6" fill="#eee" stroke="#333" stroke-width="2"/>
<text x="700" y="126" text-anchor="middle" class="t h">Habitacion</text>
<text x="585" y="165" class="t f">PK id_habitacion</text><text x="585" y="190" class="t f">numero *</text><text x="585" y="215" class="t f">capacidad</text><text x="585" y="240" class="t f">orientacion</text><text x="585" y="265" class="t f">estado *</text><text x="585" y="290" class="t f">valor_pasajero *</text>

<!-- Huesped -->
<rect x="1060" y="100" width="270" height="200" rx="6" class="box"/>
<rect x="1060" y="100" width="270" height="40" rx="6" fill="#eee" stroke="#333" stroke-width="2"/>
<text x="1195" y="126" text-anchor="middle" class="t h">Huesped</text>
<text x="1080" y="165" class="t f">PK id_huesped</text><text x="1080" y="190" class="t f">documento *</text><text x="1080" y="215" class="t f">nombre *</text><text x="1080" y="240" class="t f">apellido *</text><text x="1080" y="265" class="t f">telefono *</text><text x="1080" y="290" class="t f">email *</text>

<!-- Reserva -->
<rect x="310" y="430" width="300" height="235" rx="6" class="box"/>
<rect x="310" y="430" width="300" height="40" rx="6" fill="#eee" stroke="#333" stroke-width="2"/>
<text x="460" y="456" text-anchor="middle" class="t h">Reserva</text>
<text x="330" y="495" class="t f">PK id_reserva</text><text x="330" y="520" class="t f">FK id_habitacion</text><text x="330" y="545" class="t f">FK id_usuario_creador</text><text x="330" y="570" class="t f">fecha_entrada *</text><text x="330" y="595" class="t f">fecha_salida *</text><text x="330" y="620" class="t f">estado *</text><text x="330" y="645" class="t f">fecha_creacion</text>

<!-- Estadia -->
<rect x="790" y="430" width="300" height="260" rx="6" class="box"/>
<rect x="790" y="430" width="300" height="40" rx="6" fill="#eee" stroke="#333" stroke-width="2"/>
<text x="940" y="456" text-anchor="middle" class="t h">Estadia</text>
<text x="810" y="495" class="t f">PK id_estadia</text><text x="810" y="520" class="t f">FK id_reserva (opcional)</text><text x="810" y="545" class="t f">FK id_habitacion</text><text x="810" y="570" class="t f">FK id_usuario_registro</text><text x="810" y="595" class="t f">checkin</text><text x="810" y="620" class="t f">checkout</text><text x="810" y="645" class="t f">total_calculado</text><text x="810" y="670" class="t f">estado</text>

<!-- Puentes -->
<rect x="310" y="790" width="300" height="120" rx="6" class="box"/>
<rect x="310" y="790" width="300" height="40" rx="6" fill="#eee" stroke="#333" stroke-width="2"/>
<text x="460" y="816" text-anchor="middle" class="t h">Reserva_Huesped</text>
<text x="330" y="855" class="t f">PK/FK id_reserva</text><text x="330" y="882" class="t f">PK/FK id_huesped</text>

<rect x="790" y="790" width="300" height="120" rx="6" class="box"/>
<rect x="790" y="790" width="300" height="40" rx="6" fill="#eee" stroke="#333" stroke-width="2"/>
<text x="940" y="816" text-anchor="middle" class="t h">Estadia_Huesped</text>
<text x="810" y="855" class="t f">PK/FK id_estadia</text><text x="810" y="882" class="t f">PK/FK id_huesped</text>

<!-- Relationships -->
<path d="M205 290 L205 550 L310 550" class="line"/><text x="218" y="535" class="t f">1 : N</text>
<path d="M700 300 L700 520 L610 520" class="line"/><text x="650" y="505" class="t f">1 : N</text>
<path d="M700 300 L700 560 L790 560" class="line"/><text x="720" y="545" class="t f">1 : N</text>
<path d="M340 220 L385 220 L385 430" class="line"/><text x="350" y="405" class="t f">1 : N</text>
<path d="M340 250 L735 250 L735 585 L790 585" class="line"/><text x="745" y="570" class="t f">1 : N</text>
<path d="M610 600 L690 600 L690 470 L790 470" class="line"/><text x="700" y="490" class="t f">0..1 : 1</text>

<path d="M460 665 L460 790" class="line"/><text x="470" y="735" class="t f">1 : N</text>
<path d="M1195 300 L1195 850 L1090 850" class="line"/><text x="1110" y="835" class="t f">1 : N</text>
<path d="M610 850 L710 850 L710 350 L1195 350 L1195 300" class="line"/><text x="900" y="338" class="t f">N : 1</text>

<path d="M940 690 L940 790" class="line"/><text x="950" y="740" class="t f">1 : N</text>
<path d="M1090 875 L1195 875 L1195 300" class="line"/><text x="1110" y="895" class="t f">N : 1</text>

<text x="70" y="955" class="t f">* Campo o valor propuesto que debe validarse porque el Caso 6 no lo define de forma exacta.</text>
</svg>