<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
  </marker>
  <style>
    .t{font-family:Arial,sans-serif;fill:#222}.title{font-size:28px;font-weight:700}.label{font-size:18px}.small{font-size:15px}
    .boundary{fill:#fff;stroke:#333;stroke-width:2}.uc{fill:#fff;stroke:#333;stroke-width:2}
    .assoc{stroke:#555;stroke-width:2;fill:none}.inc{stroke:#333;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1300" height="900" fill="white"/>
<text x="650" y="38" text-anchor="middle" class="t title">Diagrama de casos de uso - Hotel Duerme Bien</text>

<rect x="280" y="75" width="970" height="770" rx="8" class="boundary"/>
<text x="305" y="108" class="t label" font-weight="700">Sistema de Pasajeros</text>

<!-- Administrador -->
<circle cx="120" cy="170" r="22" fill="white" stroke="#333" stroke-width="2"/>
<line x1="120" y1="192" x2="120" y2="265" class="assoc"/>
<line x1="75" y1="220" x2="165" y2="220" class="assoc"/>
<line x1="120" y1="265" x2="83" y2="320" class="assoc"/>
<line x1="120" y1="265" x2="157" y2="320" class="assoc"/>
<text x="120" y="352" text-anchor="middle" class="t label">Administrador</text>

<!-- Encargado -->
<circle cx="120" cy="535" r="22" fill="white" stroke="#333" stroke-width="2"/>
<line x1="120" y1="557" x2="120" y2="630" class="assoc"/>
<line x1="75" y1="585" x2="165" y2="585" class="assoc"/>
<line x1="120" y1="630" x2="83" y2="685" class="assoc"/>
<line x1="120" y1="630" x2="157" y2="685" class="assoc"/>
<text x="120" y="718" text-anchor="middle" class="t label">Encargado de hotel</text>

<!-- Admin use cases -->
<ellipse cx="500" cy="150" rx="145" ry="40" class="uc"/>
<text x="500" y="156" text-anchor="middle" class="t label">Gestionar habitaciones</text>

<ellipse cx="500" cy="245" rx="135" ry="40" class="uc"/>
<text x="500" y="251" text-anchor="middle" class="t label">Gestionar usuarios</text>

<ellipse cx="870" cy="150" rx="125" ry="40" class="uc"/>
<text x="870" y="156" text-anchor="middle" class="t label">Generar informes</text>

<ellipse cx="870" cy="245" rx="115" ry="40" class="uc"/>
<text x="870" y="251" text-anchor="middle" class="t label">Iniciar sesión</text>

<!-- Operational use cases -->
<ellipse cx="500" cy="410" rx="135" ry="40" class="uc"/>
<text x="500" y="416" text-anchor="middle" class="t label">Registrar huésped</text>

<ellipse cx="500" cy="505" rx="135" ry="40" class="uc"/>
<text x="500" y="511" text-anchor="middle" class="t label">Gestionar reserva</text>

<ellipse cx="500" cy="600" rx="135" ry="40" class="uc"/>
<text x="500" y="606" text-anchor="middle" class="t label">Realizar check-in</text>

<ellipse cx="500" cy="695" rx="135" ry="40" class="uc"/>
<text x="500" y="701" text-anchor="middle" class="t label">Realizar check-out</text>

<!-- Included use cases -->
<ellipse cx="980" cy="505" rx="150" ry="40" class="uc"/>
<text x="980" y="511" text-anchor="middle" class="t label">Consultar disponibilidad</text>

<ellipse cx="980" cy="600" rx="135" ry="40" class="uc"/>
<text x="980" y="606" text-anchor="middle" class="t label">Asignar habitación</text>

<ellipse cx="930" cy="695" rx="115" ry="40" class="uc"/>
<text x="930" y="701" text-anchor="middle" class="t label">Calcular costo</text>

<ellipse cx="1110" cy="785" rx="125" ry="40" class="uc"/>
<text x="1110" y="791" text-anchor="middle" class="t label">Liberar habitación</text>

<!-- Actor associations: no arrowheads -->
<line x1="165" y1="205" x2="355" y2="158" class="assoc"/>
<line x1="165" y1="225" x2="365" y2="245" class="assoc"/>
<line x1="165" y1="245" x2="745" y2="158" class="assoc"/>
<line x1="165" y1="265" x2="755" y2="245" class="assoc"/>

<line x1="165" y1="570" x2="365" y2="420" class="assoc"/>
<line x1="165" y1="585" x2="365" y2="505" class="assoc"/>
<line x1="165" y1="600" x2="365" y2="600" class="assoc"/>
<line x1="165" y1="615" x2="365" y2="695" class="assoc"/>

<!-- Clear include relations -->
<line x1="635" y1="505" x2="830" y2="505" class="inc"/>
<rect x="675" y="476" width="112" height="24" fill="white"/>
<text x="731" y="493" text-anchor="middle" class="t small">&lt;&lt;include&gt;&gt;</text>

<line x1="635" y1="600" x2="845" y2="600" class="inc"/>
<rect x="686" y="571" width="112" height="24" fill="white"/>
<text x="742" y="588" text-anchor="middle" class="t small">&lt;&lt;include&gt;&gt;</text>

<line x1="980" y1="560" x2="980" y2="545" class="inc"/>
<rect x="994" y="536" width="112" height="24" fill="white"/>
<text x="1050" y="553" text-anchor="middle" class="t small">&lt;&lt;include&gt;&gt;</text>

<line x1="635" y1="695" x2="815" y2="695" class="inc"/>
<rect x="670" y="666" width="112" height="24" fill="white"/>
<text x="726" y="683" text-anchor="middle" class="t small">&lt;&lt;include&gt;&gt;</text>

<path d="M600 725 L600 785 L985 785" class="inc"/>
<rect x="730" y="756" width="112" height="24" fill="white"/>
<text x="786" y="773" text-anchor="middle" class="t small">&lt;&lt;include&gt;&gt;</text>

<text x="305" y="825" class="t small">Las líneas continuas son asociaciones. Las flechas discontinuas muestran relaciones &lt;&lt;include&gt;&gt;.</text>
</svg>