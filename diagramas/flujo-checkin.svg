<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1250" viewBox="0 0 900 1250">
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#444"/></marker>
  <style>.t{font-family:Arial,sans-serif;fill:#222}.title{font-size:26px;font-weight:700}.label{font-size:16px}.small{font-size:14px}.s{fill:white;stroke:#333;stroke-width:2}.l{fill:none;stroke:#444;stroke-width:2;marker-end:url(#a)}</style>
