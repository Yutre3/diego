<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
<defs>
<marker id="tri" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L10,5 z" fill="white" stroke="#444" stroke-width="1.5"/></marker>
<style>.t{font-family:Arial,sans-serif;fill:#222}.title{font-size:27px;font-weight:700}.h{font-size:17px;font-weight:700}.f{font-size:13px}.b{fill:#fff;stroke:#444;stroke-width:2}.sep{stroke:#666;stroke-width:1.2}.rel{stroke:#555;stroke-width:2;fill:none}.inh{stroke:#555;stroke-width:2;fill:none;marker-end:url(#tri)}</style>
</defs>
<rect width="1500" height="1050" fill="white"/><text x="750" y="38" text-anchor="middle" class="t title">Guía de clases aplicada - Hotel Duerme Bien</text>

<!-- user hierarchy -->
<g><rect x="600" y="80" width="300" height="175" class="b"/><line x1="600" y1="120" x2="900" y2="120" class="sep"/><line x1="600" y1="190" x2="900" y2="190" class="sep"/><text x="750" y="107" text-anchor="middle" class="t h">Usuario</text><text x="620" y="145" class="t f">- idUsuario: int</text><text x="620" y="168" class="t f">- rol: String</text><text x="620" y="216" class="t f">+ iniciarSesion()</text><text x="620" y="239" class="t f">+ cerrarSesion()</text></g>
<g><rect x="300" y="330" width="285" height="150" class="b"/><line x1="300" y1="370" x2="585" y2="370" class="sep"/><line x1="300" y1="410" x2="585" y2="410" class="sep"/><text x="442" y="357" text-anchor="middle" class="t h">Administrador</text><text x="320" y="397" class="t f">- permisos: String *</text><text x="320" y="440" class="t f">+ gestionarUsuarios()</text><text x="320" y="463" class="t f">+ generarInforme()</text></g>
<g><rect x="915" y="330" width="285" height="150" class="b"/><line x1="915" y1="370" x2="1200" y2="370" class="sep"/><line x1="915" y1="410" x2="1200" y2="410" class="sep"/><text x="1057" y="357" text-anchor="middle" class="t h">EncargadoHotel</text><text x="935" y="397" class="t f">- turno: String *</text><text x="935" y="440" class="t f">+ gestionarReserva()</text><text x="935" y="463" class="t f">+ realizarCheckInOut()</text></g>
<path d="M442 330 L442 290 L680 290 L680 255" class="inh"/><path d="M1057 330 L1057 290 L820 290 L820 255" class="inh"/>

<!-- domain row -->
<g><rect x="60" y="610" width="260" height="205" class="b"/><line x1="60" y1="650" x2="320" y2="650" class="sep"/><line x1="60" y1="745" x2="320" y2="745" class="sep"/><text x="190" y="637" text-anchor="middle" class="t h">Huesped</text><text x="80" y="676" class="t f">- idHuesped: int</text><text x="80" y="699" class="t f">- nombre: String</text><text x="80" y="722" class="t f">- datos: String *</text><text x="80" y="775" class="t f">+ registrar()</text><text x="80" y="798" class="t f">+ actualizar()</text></g>
<g><rect x="390" y="610" width="260" height="205" class="b"/><line x1="390" y1="650" x2="650" y2="650" class="sep"/><line x1="390" y1="745" x2="650" y2="745" class="sep"/><text x="520" y="637" text-anchor="middle" class="t h">Reserva</text><text x="410" y="676" class="t f">- idReserva: int</text><text x="410" y="699" class="t f">- fechas: Date *</text><text x="410" y="722" class="t f">- estado: String *</text><text x="410" y="775" class="t f">+ crear()</text><text x="410" y="798" class="t f">+ modificar()</text></g>
<g><rect x="720" y="610" width="260" height="205" class="b"/><line x1="720" y1="650" x2="980" y2="650" class="sep"/><line x1="720" y1="745" x2="980" y2="745" class="sep"/><text x="850" y="637" text-anchor="middle" class="t h">Habitacion</text><text x="740" y="676" class="t f">- idHabitacion: int</text><text x="740" y="699" class="t f">- capacidad: int</text><text x="740" y="722" class="t f">- orientacion: String</text><text x="740" y="775" class="t f">+ estaDisponible()</text><text x="740" y="798" class="t f">+ cambiarEstado()</text></g>
<g><rect x="1050" y="610" width="270" height="205" class="b"/><line x1="1050" y1="650" x2="1320" y2="650" class="sep"/><line x1="1050" y1="745" x2="1320" y2="745" class="sep"/><text x="1185" y="637" text-anchor="middle" class="t h">Estadia</text><text x="1070" y="676" class="t f">- idEstadia: int</text><text x="1070" y="699" class="t f">- checkIn: DateTime</text><text x="1070" y="722" class="t f">- total: decimal</text><text x="1070" y="775" class="t f">+ calcularCosto()</text><text x="1070" y="798" class="t f">+ registrarCheckOut()</text></g>

<!-- supports -->
<g><rect x="75" y="885" width="260" height="120" class="b"/><line x1="75" y1="925" x2="335" y2="925" class="sep"/><text x="205" y="912" text-anchor="middle" class="t h">ValidacionEntrada</text><text x="95" y="958" class="t f">+ validarTexto()</text><text x="95" y="981" class="t f">+ validarNumero()</text></g>
<g><rect x="620" y="885" width="280" height="120" class="b"/><line x1="620" y1="925" x2="900" y2="925" class="sep"/><text x="760" y="912" text-anchor="middle" class="t h">Informe</text><text x="640" y="958" class="t f">+ generarOcupacion()</text><text x="640" y="981" class="t f">+ generarReservas()</text></g>
<g><rect x="1080" y="885" width="300" height="120" class="b"/><line x1="1080" y1="925" x2="1380" y2="925" class="sep"/><text x="1230" y="912" text-anchor="middle" class="t h">SistemaAutenticacion *</text><text x="1100" y="958" class="t f">+ autenticarUsuario()</text><text x="1100" y="981" class="t f">+ autorizarUsuario()</text></g>

<!-- clear relations -->
<line x1="320" y1="710" x2="390" y2="710" class="rel"/><text x="333" y="694" class="t f">0..*</text><text x="365" y="735" class="t f">0..*</text>
<line x1="650" y1="710" x2="720" y2="710" class="rel"/><text x="660" y="694" class="t f">0..*</text><text x="700" y="735" class="t f">1</text>
<line x1="980" y1="710" x2="1050" y2="710" class="rel"/><text x="990" y="694" class="t f">1</text><text x="1020" y="735" class="t f">0..*</text>
<line x1="190" y1="815" x2="205" y2="885" class="rel"/>
<line x1="442" y1="480" x2="760" y2="885" class="rel"/>
<line x1="750" y1="255" x2="1230" y2="885" class="rel"/>

<text x="750" y="1035" text-anchor="middle" class="t f">* Elementos técnicos o atributos exactos no definidos por el Caso 6; se incluyen solo para seguir el formato de la guía de clases.</text>
</svg>