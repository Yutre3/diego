<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030">
<defs><marker id="tri" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L10,5 z" fill="white" stroke="#444" stroke-width="1.5"/></marker>
<style>.t{font-family:Arial,sans-serif;fill:#222}.title{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.f{font-size:14px}.b{fill:#fff;stroke:#444;stroke-width:2}.sep{stroke:#666;stroke-width:1.2}.rel{stroke:#555;stroke-width:2;fill:none}.inh{stroke:#555;stroke-width:2;fill:none;marker-end:url(#tri)}.lbl{fill:#fff;stroke:#ddd}</style></defs>
<rect width="1500" height="1030" fill="white"/><text x="750" y="40" text-anchor="middle" class="t title">Diagrama de clases completo - Hotel Duerme Bien</text>

<!-- Usuario arriba -->
<g><rect x="600" y="80" width="300" height="175" class="b"/><line x1="600" y1="120" x2="900" y2="120" class="sep"/><line x1="600" y1="190" x2="900" y2="190" class="sep"/><text x="750" y="107" text-anchor="middle" class="t h">Usuario</text><text x="620" y="145" class="t f">- idUsuario: int</text><text x="620" y="168" class="t f">- rol: String</text><text x="620" y="216" class="t f">+ iniciarSesion()</text><text x="620" y="239" class="t f">+ cerrarSesion()</text></g>
<g><rect x="270" y="330" width="285" height="150" class="b"/><line x1="270" y1="370" x2="555" y2="370" class="sep"/><line x1="270" y1="410" x2="555" y2="410" class="sep"/><text x="412" y="357" text-anchor="middle" class="t h">Administrador</text><text x="290" y="397" class="t f">- permisos: String *</text><text x="290" y="440" class="t f">+ gestionarUsuarios()</text><text x="290" y="463" class="t f">+ generarInforme()</text></g>
<g><rect x="945" y="330" width="285" height="150" class="b"/><line x1="945" y1="370" x2="1230" y2="370" class="sep"/><line x1="945" y1="410" x2="1230" y2="410" class="sep"/><text x="1087" y="357" text-anchor="middle" class="t h">EncargadoHotel</text><text x="965" y="397" class="t f">- turno: String *</text><text x="965" y="440" class="t f">+ gestionarReserva()</text><text x="965" y="463" class="t f">+ realizarCheckInOut()</text></g>
<path d="M412 330 V290 H680 V255" class="inh"/><path d="M1087 330 V290 H820 V255" class="inh"/>
<rect x="655" y="274" width="190" height="26" rx="5" class="lbl"/><text x="750" y="293" text-anchor="middle" class="t f">herencia / generalización</text>

<!-- fila dominio -->
<g><rect x="70" y="600" width="265" height="210" class="b"/><line x1="70" y1="640" x2="335" y2="640" class="sep"/><line x1="70" y1="735" x2="335" y2="735" class="sep"/><text x="202" y="627" text-anchor="middle" class="t h">Huesped</text><text x="90" y="666" class="t f">- idHuesped: int</text><text x="90" y="689" class="t f">- nombre: String</text><text x="90" y="712" class="t f">- datos: String *</text><text x="90" y="765" class="t f">+ registrar()</text><text x="90" y="788" class="t f">+ actualizar()</text></g>
<g><rect x="390" y="600" width="265" height="210" class="b"/><line x1="390" y1="640" x2="655" y2="640" class="sep"/><line x1="390" y1="735" x2="655" y2="735" class="sep"/><text x="522" y="627" text-anchor="middle" class="t h">Reserva</text><text x="410" y="666" class="t f">- idReserva: int</text><text x="410" y="689" class="t f">- fechas: Date *</text><text x="410" y="712" class="t f">- estado: String *</text><text x="410" y="765" class="t f">+ crear()</text><text x="410" y="788" class="t f">+ modificar()</text></g>
<g><rect x="710" y="600" width="265" height="210" class="b"/><line x1="710" y1="640" x2="975" y2="640" class="sep"/><line x1="710" y1="735" x2="975" y2="735" class="sep"/><text x="842" y="627" text-anchor="middle" class="t h">Habitacion</text><text x="730" y="666" class="t f">- idHabitacion: int</text><text x="730" y="689" class="t f">- capacidad: int</text><text x="730" y="712" class="t f">- orientacion: String</text><text x="730" y="765" class="t f">+ estaDisponible()</text><text x="730" y="788" class="t f">+ cambiarEstado()</text></g>
<g><rect x="1030" y="600" width="280" height="210" class="b"/><line x1="1030" y1="640" x2="1310" y2="640" class="sep"/><line x1="1030" y1="735" x2="1310" y2="735" class="sep"/><text x="1170" y="627" text-anchor="middle" class="t h">Estadia</text><text x="1050" y="666" class="t f">- idEstadia: int</text><text x="1050" y="689" class="t f">- checkIn: DateTime</text><text x="1050" y="712" class="t f">- total: decimal</text><text x="1050" y="765" class="t f">+ calcularCosto()</text><text x="1050" y="788" class="t f">+ registrarCheckOut()</text></g>

<!-- relaciones dominio: rectas, sin cruces -->
<line x1="335" y1="700" x2="390" y2="700" class="rel"/><text x="342" y="682" class="t f">0..*</text><text x="370" y="724" class="t f">0..*</text>
<line x1="655" y1="700" x2="710" y2="700" class="rel"/><text x="662" y="682" class="t f">0..*</text><text x="693" y="724" class="t f">1</text>
<line x1="975" y1="700" x2="1030" y2="700" class="rel"/><text x="982" y="682" class="t f">1</text><text x="1003" y="724" class="t f">0..*</text>

<!-- complementos abajo, separados -->
<g><rect x="145" y="875" width="270" height="115" class="b"/><line x1="145" y1="915" x2="415" y2="915" class="sep"/><text x="280" y="902" text-anchor="middle" class="t h">ValidacionEntrada *</text><text x="165" y="950" class="t f">+ validarTexto()</text><text x="165" y="973" class="t f">+ validarNumero()</text></g>
<g><rect x="615" y="875" width="270" height="115" class="b"/><line x1="615" y1="915" x2="885" y2="915" class="sep"/><text x="750" y="902" text-anchor="middle" class="t h">Informe</text><text x="635" y="950" class="t f">+ generarOcupacion()</text><text x="635" y="973" class="t f">+ generarReservas()</text></g>
<g><rect x="1085" y="875" width="270" height="115" class="b"/><line x1="1085" y1="915" x2="1355" y2="915" class="sep"/><text x="1220" y="902" text-anchor="middle" class="t h">SistemaAutenticacion *</text><text x="1105" y="950" class="t f">+ autenticarUsuario()</text><text x="1105" y="973" class="t f">+ autorizarUsuario()</text></g>

<!-- conexiones de apoyo solo verticales -->
<line x1="202" y1="810" x2="280" y2="875" class="rel"/>
<line x1="412" y1="480" x2="750" y2="875" class="rel"/>
<line x1="750" y1="255" x2="1220" y2="875" class="rel"/>

<text x="750" y="1018" text-anchor="middle" class="t f">* Elementos técnicos o atributos exactos no definidos por el Caso 6; se muestran solo para seguir el formato de la guía.</text>
</svg>