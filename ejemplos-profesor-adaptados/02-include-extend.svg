<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
  <style>.t{font-family:Arial,sans-serif;fill:#222}.title{font-size:27px;font-weight:700}.f{font-size:18px}.s{font-size:15px}.uc{fill:#fff;stroke:#333;stroke-width:2}.dep{stroke:#333;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arr)}.assoc{stroke:#444;stroke-width:2;fill:none}</style>
</defs>
<rect width="1200" height="720" fill="white"/>
<text x="600" y="38" text-anchor="middle" class="t title">Ejemplo de &lt;&lt;include&gt;&gt; y &lt;&lt;extend&gt;&gt; - Hotel Duerme Bien</text>

<!-- actor -->
<circle cx="115" cy="280" r="22" fill="white" stroke="#333" stroke-width="2"/><line x1="115" y1="302" x2="115" y2="375" class="assoc"/><line x1="75" y1="330" x2="155" y2="330" class="assoc"/><line x1="115" y1="375" x2="80" y2="425" class="assoc"/><line x1="115" y1="375" x2="150" y2="425" class="assoc"/><text x="115" y="455" text-anchor="middle" class="t f">Encargado de hotel</text>

<!-- base cases -->
<ellipse cx="470" cy="210" rx="150" ry="48" class="uc"/><text x="470" y="216" text-anchor="middle" class="t f">Gestionar reserva</text>
<ellipse cx="470" cy="400" rx="150" ry="48" class="uc"/><text x="470" y="406" text-anchor="middle" class="t f">Realizar check-in</text>

<!-- included/extended -->
<ellipse cx="870" cy="210" rx="165" ry="48" class="uc"/><text x="870" y="216" text-anchor="middle" class="t f">Consultar disponibilidad</text>
<ellipse cx="870" cy="400" rx="145" ry="48" class="uc"/><text x="870" y="406" text-anchor="middle" class="t f">Registrar huésped</text>

<!-- actor associations -->
<line x1="155" y1="320" x2="320" y2="220" class="assoc"/><line x1="155" y1="342" x2="320" y2="400" class="assoc"/>

<!-- include: base to included -->
<line x1="620" y1="210" x2="705" y2="210" class="dep"/><text x="662" y="190" text-anchor="middle" class="t s">&lt;&lt;include&gt;&gt;</text>

<!-- extend: extension to base -->
<line x1="725" y1="400" x2="620" y2="400" class="dep"/><text x="672" y="380" text-anchor="middle" class="t s">&lt;&lt;extend&gt;&gt;</text>
<text x="870" y="468" text-anchor="middle" class="t s">Condición: huésped aún no registrado</text>

<rect x="230" y="555" width="740" height="110" rx="10" fill="#f6f8f9" stroke="#cfd8dc"/>
<text x="260" y="588" class="t s">• Gestionar reserva incluye Consultar disponibilidad porque la reserva necesita comprobar disponibilidad.</text>
<text x="260" y="620" class="t s">• Registrar huésped extiende Realizar check-in solo si el huésped todavía no existe en el sistema.</text>
<text x="260" y="652" class="t s">• El caso base Realizar check-in puede continuar sin Registrar huésped cuando el huésped ya estaba registrado.</text>
</svg>