<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
<style>.t{font-family:Arial,sans-serif;fill:#222}.title{font-size:29px;font-weight:700}.f{font-size:20px}.s{font-size:16px}.uc{fill:#fff;stroke:#333;stroke-width:2.3}.line{stroke:#444;stroke-width:2.3;fill:none}.dep{stroke:#333;stroke-width:2.3;stroke-dasharray:9 7;fill:none;marker-end:url(#a)}.note{fill:#f7f9fa;stroke:#cfd8dc;stroke-width:1.5}</style></defs>
<rect width="1200" height="760" fill="white"/>
<text x="600" y="42" text-anchor="middle" class="t title">&lt;&lt;include&gt;&gt; y &lt;&lt;extend&gt;&gt; - Hotel Duerme Bien</text>

<!-- actor -->
<circle cx="125" cy="260" r="24" fill="white" stroke="#333" stroke-width="2.3"/><line x1="125" y1="284" x2="125" y2="360" class="line"/><line x1="80" y1="312" x2="170" y2="312" class="line"/><line x1="125" y1="360" x2="88" y2="415" class="line"/><line x1="125" y1="360" x2="162" y2="415" class="line"/><text x="125" y="450" text-anchor="middle" class="t f">Encargado</text>

<!-- Fila include -->
<ellipse cx="445" cy="200" rx="155" ry="50" class="uc"/><text x="445" y="207" text-anchor="middle" class="t f">Gestionar reserva</text>
<ellipse cx="870" cy="200" rx="175" ry="50" class="uc"/><text x="870" y="207" text-anchor="middle" class="t f">Consultar disponibilidad</text>
<line x1="600" y1="200" x2="695" y2="200" class="dep"/><text x="647" y="180" text-anchor="middle" class="t s">&lt;&lt;include&gt;&gt;</text>

<!-- Fila extend -->
<ellipse cx="445" cy="420" rx="155" ry="50" class="uc"/><text x="445" y="427" text-anchor="middle" class="t f">Realizar check-in</text>
<ellipse cx="870" cy="420" rx="155" ry="50" class="uc"/><text x="870" y="427" text-anchor="middle" class="t f">Registrar huésped</text>
<line x1="715" y1="420" x2="600" y2="420" class="dep"/><text x="657" y="400" text-anchor="middle" class="t s">&lt;&lt;extend&gt;&gt;</text>
<text x="870" y="492" text-anchor="middle" class="t s">Condición: huésped aún no registrado</text>

<!-- actor associations -->
<line x1="170" y1="302" x2="290" y2="215" class="line"/>
<line x1="170" y1="330" x2="290" y2="420" class="line"/>

<rect x="245" y="575" width="720" height="125" rx="10" class="note"/>
<text x="275" y="612" class="t s">INCLUDE: el caso base necesita al caso incluido para completar su objetivo.</text>
<text x="275" y="646" class="t s">EXTEND: agrega comportamiento solo bajo una condición; el caso base puede existir sin la extensión.</text>
<text x="275" y="680" class="t s">Las flechas están separadas para que se vea claramente la dirección de cada relación.</text>
</svg>