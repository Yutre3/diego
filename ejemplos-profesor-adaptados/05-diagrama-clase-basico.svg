<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="760" viewBox="0 0 1150 760">
<defs><style>.t{font-family:Arial,sans-serif;fill:#222}.title{font-size:26px;font-weight:700}.h{font-size:20px;font-weight:700}.f{font-size:16px}.box{fill:white;stroke:#333;stroke-width:2}.sep{stroke:#333;stroke-width:1.5}.rel{stroke:#444;stroke-width:2;fill:none}</style></defs>
<rect width="1150" height="760" fill="white"/>
<text x="575" y="38" text-anchor="middle" class="t title">Diagrama de clases básico - Hotel Duerme Bien</text>

<rect x="85" y="115" width="300" height="250" class="box"/><line x1="85" y1="160" x2="385" y2="160" class="sep"/><line x1="85" y1="270" x2="385" y2="270" class="sep"/>
<text x="235" y="145" text-anchor="middle" class="t h">Habitacion</text>
<text x="105" y="190" class="t f">- idHabitacion: int</text><text x="105" y="218" class="t f">- capacidad: int</text><text x="105" y="246" class="t f">- orientacion: String</text>
<text x="105" y="305" class="t f">+ estaDisponible(): boolean</text><text x="105" y="333" class="t f">+ cambiarEstado(): void</text>

<rect x="755" y="115" width="300" height="250" class="box"/><line x1="755" y1="160" x2="1055" y2="160" class="sep"/><line x1="755" y1="270" x2="1055" y2="270" class="sep"/>
<text x="905" y="145" text-anchor="middle" class="t h">Huesped</text>
<text x="775" y="190" class="t f">- idHuesped: int</text><text x="775" y="218" class="t f">- nombre: String</text><text x="775" y="246" class="t f">- datos: String *</text>
<text x="775" y="305" class="t f">+ registrar(): void</text><text x="775" y="333" class="t f">+ actualizar(): void</text>

<rect x="420" y="470" width="310" height="220" class="box"/><line x1="420" y1="515" x2="730" y2="515" class="sep"/><line x1="420" y1="600" x2="730" y2="600" class="sep"/>
<text x="575" y="500" text-anchor="middle" class="t h">Estadia</text>
<text x="440" y="545" class="t f">- idEstadia: int</text><text x="440" y="573" class="t f">- estado: String</text>
<text x="440" y="635" class="t f">+ registrarCheckIn(): void</text><text x="440" y="663" class="t f">+ registrarCheckOut(): void</text>

<line x1="235" y1="365" x2="500" y2="470" class="rel"/><text x="310" y="410" class="t f">1</text><text x="470" y="455" class="t f">0..*</text>
<line x1="905" y1="365" x2="650" y2="470" class="rel"/><text x="825" y="410" class="t f">1</text><text x="660" y="455" class="t f">0..*</text>

<text x="575" y="730" text-anchor="middle" class="t f">Cada clase usa tres secciones: nombre, atributos y operaciones, como en el material de clase.</text>
<text x="575" y="752" text-anchor="middle" class="t f">* Los datos personales exactos del huésped deben validarse.</text>
</svg>