<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
<style>.t{font-family:Arial,sans-serif;fill:#222}.title{font-size:28px;font-weight:700}.f{font-size:18px}.s{font-size:14px}.sys{fill:#fff;stroke:#333;stroke-width:2.3}.uc{fill:#fff;stroke:#333;stroke-width:2.3}.line{stroke:#444;stroke-width:2.2;fill:none}.dep{stroke:#333;stroke-width:2.2;stroke-dasharray:9 7;fill:none;marker-end:url(#a)}.box{fill:#fff;stroke:#555;stroke-width:2}.tag{fill:white;stroke:#ddd}</style></defs>
<rect width="1320" height="820" fill="white"/><text x="660" y="42" text-anchor="middle" class="t title">Ejemplo amplio de casos de uso - Hotel Duerme Bien</text>
<rect x="230" y="80" width="790" height="650" rx="7" class="sys"/><text x="625" y="115" text-anchor="middle" class="t f" font-weight="700">Sistema de Pasajeros</text>

<!-- actor left -->
<circle cx="90" cy="325" r="22" fill="white" stroke="#333" stroke-width="2.2"/><line x1="90" y1="347" x2="90" y2="420" class="line"/><line x1="50" y1="372" x2="130" y2="372" class="line"/><line x1="90" y1="420" x2="56" y2="470" class="line"/><line x1="90" y1="420" x2="124" y2="470" class="line"/><text x="90" y="505" text-anchor="middle" class="t f">Encargado</text>

<!-- base case -->
<ellipse cx="430" cy="390" rx="145" ry="55" class="uc"/><text x="430" y="382" text-anchor="middle" class="t f">Gestionar</text><text x="430" y="408" text-anchor="middle" class="t f">estadía</text>
<line x1="130" y1="372" x2="285" y2="390" class="line"/>

<!-- related use cases stacked -->
<ellipse cx="780" cy="170" rx="145" ry="45" class="uc"/><text x="780" y="177" text-anchor="middle" class="t f">Registrar reserva</text>
<ellipse cx="780" cy="285" rx="145" ry="45" class="uc"/><text x="780" y="292" text-anchor="middle" class="t f">Realizar check-in</text>
<ellipse cx="780" cy="400" rx="145" ry="45" class="uc"/><text x="780" y="407" text-anchor="middle" class="t f">Realizar check-out</text>
<ellipse cx="780" cy="515" rx="165" ry="45" class="uc"/><text x="780" y="522" text-anchor="middle" class="t f">Consultar información</text>
<ellipse cx="780" cy="650" rx="170" ry="45" class="uc"/><text x="780" y="657" text-anchor="middle" class="t f">Consultar disponibilidad</text>

<!-- extend arrows, each in separated horizontal/diagonal corridor -->
<path d="M635 170 H600 L540 340" class="dep"/><rect x="548" y="215" width="112" height="26" rx="5" class="tag"/><text x="604" y="234" text-anchor="middle" class="t s">&lt;&lt;extend&gt;&gt;</text>
<path d="M635 285 H600 L555 360" class="dep"/><rect x="560" y="292" width="112" height="26" rx="5" class="tag"/><text x="616" y="311" text-anchor="middle" class="t s">&lt;&lt;extend&gt;&gt;</text>
<path d="M635 400 H575" class="dep"/><rect x="578" y="370" width="112" height="26" rx="5" class="tag"/><text x="634" y="389" text-anchor="middle" class="t s">&lt;&lt;extend&gt;&gt;</text>
<path d="M635 515 H600 L540 440" class="dep"/><rect x="553" y="473" width="112" height="26" rx="5" class="tag"/><text x="609" y="492" text-anchor="middle" class="t s">&lt;&lt;extend&gt;&gt;</text>

<!-- include arrow separated below -->
<path d="M500 438 V650 H610" class="dep"/><rect x="515" y="555" width="118" height="26" rx="5" class="tag"/><text x="574" y="574" text-anchor="middle" class="t s">&lt;&lt;include&gt;&gt;</text>

<!-- external role boxes -->
<rect x="1080" y="200" width="185" height="95" class="box"/><text x="1172" y="235" text-anchor="middle" class="t s">&lt;&lt;actor&gt;&gt;</text><text x="1172" y="267" text-anchor="middle" class="t f">Administrador</text>
<rect x="1080" y="470" width="185" height="95" class="box"/><text x="1172" y="505" text-anchor="middle" class="t s">&lt;&lt;actor&gt;&gt;</text><text x="1172" y="537" text-anchor="middle" class="t f">Encargado</text>
<line x1="925" y1="170" x2="1080" y2="235" class="line"/>
<line x1="945" y1="515" x2="1080" y2="260" class="line"/>
<line x1="925" y1="285" x2="1080" y2="500" class="line"/>
<line x1="925" y1="400" x2="1080" y2="520" class="line"/>
<line x1="950" y1="650" x2="1080" y2="540" class="line"/>

<text x="625" y="780" text-anchor="middle" class="t s">Ejemplo de notación basado en la estructura amplia del material; no sustituye el diagrama oficial del Caso 6.</text>
