<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
<style>.t{font-family:Arial,sans-serif;fill:#222}.title{font-size:28px;font-weight:700}.f{font-size:23px}.s{font-size:18px}.line{stroke:#222;stroke-width:3.2;fill:none;marker-end:url(#a)}.term{fill:#fff;stroke:#ef7376;stroke-width:3.2}.io{fill:#fff;stroke:#28a7a5;stroke-width:3.2}.dec{fill:#fff;stroke:#555;stroke-width:3.2}.proc{fill:#fff;stroke:#28a7a5;stroke-width:3.2}.tag{fill:white;stroke:#ddd}</style></defs>
<rect width="900" height="1120" fill="white"/>
<text x="450" y="42" text-anchor="middle" class="t title">Diagrama de proceso - Check-in</text>

<rect x="320" y="75" width="260" height="75" rx="37" class="term"/><text x="450" y="122" text-anchor="middle" class="t f">Inicio</text>
<line x1="450" y1="150" x2="450" y2="220" class="line"/>

<polygon points="305,220 615,220 580,330 270,330" class="io"/><text x="443" y="266" text-anchor="middle" class="t f">Captura de datos</text><text x="443" y="298" text-anchor="middle" class="t f">del check-in</text>
<line x1="450" y1="330" x2="450" y2="395" class="line"/>

<polygon points="450,395 625,495 450,595 275,495" class="dec"/><text x="450" y="487" text-anchor="middle" class="t f">¿Error en la</text><text x="450" y="520" text-anchor="middle" class="t f">captura?</text>

<!-- Sí: loop por corredor derecho -->
<path d="M625 495 H770 V275 H615" class="line"/>
<rect x="676" y="456" width="52" height="30" rx="5" class="tag"/><text x="702" y="478" text-anchor="middle" class="t s">Sí</text>

<!-- No: baja recto -->
<line x1="450" y1="595" x2="450" y2="690" class="line"/>
<rect x="470" y="625" width="52" height="30" rx="5" class="tag"/><text x="496" y="647" text-anchor="middle" class="t s">No</text>

<rect x="265" y="690" width="370" height="120" rx="8" class="proc"/><text x="450" y="740" text-anchor="middle" class="t f">Registrar check-in</text><text x="450" y="773" text-anchor="middle" class="t f">en la base de datos</text>
<line x1="450" y1="810" x2="450" y2="900" class="line"/>

<rect x="320" y="900" width="260" height="75" rx="37" class="term"/><text x="450" y="947" text-anchor="middle" class="t f">Fin</text>

<text x="450" y="1040" text-anchor="middle" class="t s">El camino “Sí” vuelve a Captura de datos. El camino “No” continúa al registro.</text>
</svg>