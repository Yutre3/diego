<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930">
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
<style>.t{font-family:Arial,sans-serif;fill:#222}.title{font-size:30px;font-weight:700}.f{font-size:19px}.s{font-size:15px}.sys{fill:#fff;stroke:#333;stroke-width:2.5}.uc{fill:#fff;stroke:#333;stroke-width:2.3}.line{stroke:#444;stroke-width:2.3;fill:none}.inc{stroke:#333;stroke-width:2.3;stroke-dasharray:9 7;fill:none;marker-end:url(#a)}.tag{fill:#fff;stroke:#ddd}</style>
</defs>
<rect width="1400" height="930" fill="white"/>
<text x="700" y="42" text-anchor="middle" class="t title">Casos de uso - Hotel Duerme Bien</text>
<rect x="300" y="85" width="1030" height="770" rx="8" class="sys"/>
<text x="325" y="120" class="t f" font-weight="700">Sistema de Pasajeros</text>

<!-- Actores -->
<g>
<circle cx="125" cy="220" r="24" fill="white" stroke="#333" stroke-width="2.3"/><line x1="125" y1="244" x2="125" y2="320" class="line"/><line x1="80" y1="272" x2="170" y2="272" class="line"/><line x1="125" y1="320" x2="88" y2="375" class="line"/><line x1="125" y1="320" x2="162" y2="375" class="line"/><text x="125" y="410" text-anchor="middle" class="t f">Administrador</text>
</g>
<g>
<circle cx="125" cy="550" r="24" fill="white" stroke="#333" stroke-width="2.3"/><line x1="125" y1="574" x2="125" y2="650" class="line"/><line x1="80" y1="602" x2="170" y2="602" class="line"/><line x1="125" y1="650" x2="88" y2="705" class="line"/><line x1="125" y1="650" x2="162" y2="705" class="line"/><text x="125" y="740" text-anchor="middle" class="t f">Encargado de hotel</text>
</g>

<!-- Casos principales -->
<ellipse cx="520" cy="180" rx="155" ry="45" class="uc"/><text x="520" y="187" text-anchor="middle" class="t f">Gestionar habitaciones</text>
<ellipse cx="520" cy="280" rx="145" ry="45" class="uc"/><text x="520" y="287" text-anchor="middle" class="t f">Gestionar usuarios</text>
<ellipse cx="520" cy="430" rx="145" ry="45" class="uc"/><text x="520" y="437" text-anchor="middle" class="t f">Registrar huésped</text>
<ellipse cx="520" cy="530" rx="145" ry="45" class="uc"/><text x="520" y="537" text-anchor="middle" class="t f">Gestionar reserva</text>
<ellipse cx="520" cy="630" rx="145" ry="45" class="uc"/><text x="520" y="637" text-anchor="middle" class="t f">Realizar check-in</text>
<ellipse cx="520" cy="730" rx="145" ry="45" class="uc"/><text x="520" y="737" text-anchor="middle" class="t f">Realizar check-out</text>

<!-- Incluidos, alineados a la derecha -->
<ellipse cx="1040" cy="480" rx="165" ry="45" class="uc"/><text x="1040" y="487" text-anchor="middle" class="t f">Consultar disponibilidad</text>
<ellipse cx="1040" cy="590" rx="150" ry="45" class="uc"/><text x="1040" y="597" text-anchor="middle" class="t f">Asignar habitación</text>
<ellipse cx="1040" cy="700" rx="135" ry="45" class="uc"/><text x="1040" y="707" text-anchor="middle" class="t f">Calcular costo</text>
<ellipse cx="1040" cy="800" rx="145" ry="45" class="uc"/><text x="1040" y="807" text-anchor="middle" class="t f">Liberar habitación</text>

<!-- Asociaciones actor-caso: líneas simples -->
<line x1="170" y1="260" x2="365" y2="190" class="line"/>
<line x1="170" y1="285" x2="375" y2="280" class="line"/>
<line x1="170" y1="585" x2="375" y2="440" class="line"/>
<line x1="170" y1="600" x2="375" y2="530" class="line"/>
<line x1="170" y1="615" x2="375" y2="630" class="line"/>
<line x1="170" y1="630" x2="375" y2="730" class="line"/>

<!-- Include claros, en corredores separados -->
<path d="M665 530 H790 V480 H875" class="inc"/>
<rect x="705" y="492" width="118" height="28" rx="5" class="tag"/><text x="764" y="512" text-anchor="middle" class="t s">&lt;&lt;include&gt;&gt;</text>

<path d="M665 630 H815 V590 H890" class="inc"/>
<rect x="715" y="594" width="118" height="28" rx="5" class="tag"/><text x="774" y="614" text-anchor="middle" class="t s">&lt;&lt;include&gt;&gt;</text>

<path d="M665 730 H805 V700 H905" class="inc"/>
<rect x="710" y="694" width="118" height="28" rx="5" class="tag"/><text x="769" y="714" text-anchor="middle" class="t s">&lt;&lt;include&gt;&gt;</text>

<path d="M665 748 H790 V800 H895" class="inc"/>
<rect x="704" y="760" width="118" height="28" rx="5" class="tag"/><text x="763" y="780" text-anchor="middle" class="t s">&lt;&lt;include&gt;&gt;</text>

<text x="320" y="892" class="t s">Líneas continuas = asociación. Flechas discontinuas = &lt;&lt;include&gt;&gt;. Cada flecha apunta al caso incluido.</text>
</svg>