<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="920" viewBox="0 0 1350 920">
<defs><style>.t{font-family:Arial,sans-serif;fill:#222}.title{font-size:26px;font-weight:700}.h{font-size:18px;font-weight:700}.f{font-size:14px}.frame{fill:white;stroke:#555;stroke-width:2}.gray{fill:#eeeeee;stroke:#777;stroke-width:1.5}.dark{fill:#d4d4d4;stroke:#666;stroke-width:1.5}.line{stroke:#777;stroke-width:1.5}</style></defs>
<rect width="1350" height="920" fill="white"/>
<text x="675" y="38" text-anchor="middle" class="t title">Wireframe - Sistema Hotel Duerme Bien</text>

<rect x="65" y="80" width="1220" height="780" class="frame"/>
<rect x="85" y="100" width="230" height="95" class="gray"/>
<line x1="85" y1="100" x2="315" y2="195" class="line"/><line x1="315" y1="100" x2="85" y2="195" class="line"/>
<text x="200" y="215" text-anchor="middle" class="t f">Logo / nombre hotel</text>

<rect x="350" y="105" width="900" height="70" class="dark"/>
<text x="800" y="148" text-anchor="middle" class="t h">Habitaciones | Huéspedes | Reservas | Check-in | Check-out | Informes</text>

<rect x="85" y="255" width="250" height="555" class="gray"/>
<text x="210" y="290" text-anchor="middle" class="t h">Menú</text>
<rect x="110" y="320" width="200" height="42" class="frame"/><text x="210" y="347" text-anchor="middle" class="t f">Inicio</text>
<rect x="110" y="380" width="200" height="42" class="frame"/><text x="210" y="407" text-anchor="middle" class="t f">Nueva reserva</text>
<rect x="110" y="440" width="200" height="42" class="frame"/><text x="210" y="467" text-anchor="middle" class="t f">Registrar check-in</text>
<rect x="110" y="500" width="200" height="42" class="frame"/><text x="210" y="527" text-anchor="middle" class="t f">Registrar check-out</text>
<rect x="110" y="560" width="200" height="42" class="frame"/><text x="210" y="587" text-anchor="middle" class="t f">Habitaciones</text>
<rect x="110" y="620" width="200" height="42" class="frame"/><text x="210" y="647" text-anchor="middle" class="t f">Informes</text>

<text x="385" y="265" class="t h">Resumen de ocupación</text>
<rect x="385" y="290" width="250" height="125" class="gray"/><text x="510" y="350" text-anchor="middle" class="t h">Disponibles</text>
<rect x="670" y="290" width="250" height="125" class="gray"/><text x="795" y="350" text-anchor="middle" class="t h">Ocupadas</text>
<rect x="955" y="290" width="250" height="125" class="gray"/><text x="1080" y="350" text-anchor="middle" class="t h">Reservas</text>

<text x="385" y="475" class="t h">Habitaciones / reservas del día</text>
<rect x="385" y="500" width="820" height="230" class="frame"/>
<line x1="385" y1="550" x2="1205" y2="550" class="line"/>
<line x1="540" y1="500" x2="540" y2="730" class="line"/><line x1="735" y1="500" x2="735" y2="730" class="line"/><line x1="940" y1="500" x2="940" y2="730" class="line"/>
<text x="460" y="530" text-anchor="middle" class="t f">Habitación</text><text x="635" y="530" text-anchor="middle" class="t f">Huésped</text><text x="835" y="530" text-anchor="middle" class="t f">Estado</text><text x="1070" y="530" text-anchor="middle" class="t f">Acción</text>

<rect x="965" y="760" width="240" height="50" class="dark"/><text x="1085" y="792" text-anchor="middle" class="t f">Registrar nuevo check-in</text>

<text x="65" y="895" class="t f">Wireframe en escala de grises: muestra estructura y jerarquía, no el diseño visual final.</text>
</svg>