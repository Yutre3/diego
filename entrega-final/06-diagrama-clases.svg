<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<defs>
  <marker id="tri" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
    <path d="M0,0 L0,10 L10,5 z" fill="white" stroke="#444" stroke-width="1.5"/>
  </marker>
  <style>
    .t{font-family:Arial,sans-serif;fill:#222}.title{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.f{font-size:13px}
    .b1{fill:#eef2ff;stroke:#5369b8;stroke-width:2}.b2{fill:#eef9f2;stroke:#538467;stroke-width:2}.b3{fill:#fff4e8;stroke:#ad7844;stroke-width:2}.b4{fill:#f5eefb;stroke:#80589e;stroke-width:2}
    .sep{stroke:#555;stroke-width:1.3}.rel{stroke:#555;stroke-width:2;fill:none}.dash{stroke:#555;stroke-width:2;stroke-dasharray:7 5;fill:none}.inh{stroke:#555;stroke-width:2;fill:none;marker-end:url(#tri)}
  </style>
</defs>
<rect width="1600" height="1200" fill="white"/>
<text x="800" y="40" text-anchor="middle" class="t title">Diagrama de clases completo - Hotel Duerme Bien</text>

<!-- Usuario -->
<rect x="620" y="80" width="360" height="205" class="b1"/>
<line x1="620" y1="122" x2="980" y2="122" class="sep"/><line x1="620" y1="212" x2="980" y2="212" class="sep"/>
<text x="800" y="108" text-anchor="middle" class="t h">Usuario</text>
<text x="640" y="148" class="t f">- idUsuario: int</text><text x="640" y="169" class="t f">- nombre: string</text><text x="640" y="190" class="t f">- username: string</text><text x="640" y="211" class="t f">- rol: string</text>
<text x="640" y="239" class="t f">+ iniciarSesion(): boolean</text><text x="640" y="261" class="t f">+ cerrarSesion(): void</text>

<!-- Admin -->
<rect x="250" y="360" width="330" height="175" class="b1"/>
<line x1="250" y1="402" x2="580" y2="402" class="sep"/><line x1="250" y1="444" x2="580" y2="444" class="sep"/>
<text x="415" y="388" text-anchor="middle" class="t h">Administrador</text>
<text x="270" y="428" class="t f">- permisos: string</text>
<text x="270" y="472" class="t f">+ gestionarUsuarios(): void</text><text x="270" y="494" class="t f">+ gestionarHabitaciones(): void</text><text x="270" y="516" class="t f">+ generarInforme(): void</text>

<!-- Encargado -->
<rect x="1020" y="350" width="340" height="190" class="b1"/>
<line x1="1020" y1="392" x2="1360" y2="392" class="sep"/><line x1="1020" y1="434" x2="1360" y2="434" class="sep"/>
<text x="1190" y="378" text-anchor="middle" class="t h">EncargadoHotel</text>
<text x="1040" y="418" class="t f">- turno: string</text>
<text x="1040" y="462" class="t f">+ registrarHuesped(): void</text><text x="1040" y="484" class="t f">+ gestionarReserva(): void</text><text x="1040" y="506" class="t f">+ realizarCheckIn(): void</text><text x="1040" y="528" class="t f">+ realizarCheckOut(): void</text>

<path d="M415 360 L415 320 L725 320 L725 285" class="inh"/>
<path d="M1190 350 L1190 320 L875 320 L875 285" class="inh"/>

<!-- Huesped -->
<rect x="45" y="675" width="285" height="205" class="b2"/>
<line x1="45" y1="717" x2="330" y2="717" class="sep"/><line x1="45" y1="817" x2="330" y2="817" class="sep"/>
<text x="188" y="703" text-anchor="middle" class="t h">Huesped</text>
<text x="65" y="743" class="t f">- idHuesped: int</text><text x="65" y="764" class="t f">- documento: string</text><text x="65" y="785" class="t f">- nombre: string</text><text x="65" y="806" class="t f">- apellido: string</text>
<text x="65" y="844" class="t f">+ actualizarDatos(): void</text><text x="65" y="866" class="t f">+ obtenerDatos(): object</text>

<!-- Habitacion -->
<rect x="380" y="660" width="300" height="225" class="b2"/>
<line x1="380" y1="702" x2="680" y2="702" class="sep"/><line x1="380" y1="825" x2="680" y2="825" class="sep"/>
<text x="530" y="688" text-anchor="middle" class="t h">Habitacion</text>
<text x="400" y="728" class="t f">- idHabitacion: int</text><text x="400" y="749" class="t f">- numero: string</text><text x="400" y="770" class="t f">- capacidad: int</text><text x="400" y="791" class="t f">- orientacion: string</text><text x="400" y="812" class="t f">- estado: string</text>
<text x="400" y="850" class="t f">+ estaDisponible(): boolean</text><text x="400" y="872" class="t f">+ cambiarEstado(): void</text>

<!-- Reserva -->
