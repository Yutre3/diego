<line x1="730" y1="697" x2="1020" y2="697" class="sep"/><line x1="730" y1="820" x2="1020" y2="820" class="sep"/>
<text x="875" y="683" text-anchor="middle" class="t h">Reserva</text>
<text x="750" y="723" class="t f">- idReserva: int</text><text x="750" y="744" class="t f">- fechaEntrada: date</text><text x="750" y="765" class="t f">- fechaSalida: date</text><text x="750" y="786" class="t f">- estado: string</text>
<text x="750" y="847" class="t f">+ crear(): void</text><text x="750" y="869" class="t f">+ modificar(): void</text><text x="750" y="891" class="t f">+ cancelar(): void</text>

<!-- Estadia -->
<rect x="1070" y="655" width="300" height="230" class="b3"/>
<line x1="1070" y1="697" x2="1370" y2="697" class="sep"/><line x1="1070" y1="820" x2="1370" y2="820" class="sep"/>
<text x="1220" y="683" text-anchor="middle" class="t h">Estadia</text>
<text x="1090" y="723" class="t f">- idEstadia: int</text><text x="1090" y="744" class="t f">- checkIn: datetime</text><text x="1090" y="765" class="t f">- checkOut: datetime</text><text x="1090" y="786" class="t f">- totalCalculado: decimal</text>
<text x="1090" y="847" class="t f">+ registrarCheckIn(): void</text><text x="1090" y="869" class="t f">+ calcularCosto(): decimal</text><text x="1090" y="891" class="t f">+ finalizarCheckOut(): void</text>

<!-- Informe -->
<rect x="130" y="970" width="300" height="170" class="b4"/>
<line x1="130" y1="1012" x2="430" y2="1012" class="sep"/><line x1="130" y1="1075" x2="430" y2="1075" class="sep"/>
<text x="280" y="998" text-anchor="middle" class="t h">Informe</text>
<text x="150" y="1038" class="t f">- tipo: string</text><text x="150" y="1059" class="t f">- fechaGeneracion: datetime</text>
<text x="150" y="1102" class="t f">+ generarOcupacion(): void</text><text x="150" y="1124" class="t f">+ generarReservas(): void</text>

<!-- Auth -->
<rect x="500" y="955" width="340" height="190" class="b4"/>
<line x1="500" y1="997" x2="840" y2="997" class="sep"/><line x1="500" y1="1039" x2="840" y2="1039" class="sep"/>
<text x="670" y="983" text-anchor="middle" class="t h">SistemaAutenticacion</text>
<text x="520" y="1023" class="t f">- estado: string</text>
<text x="520" y="1066" class="t f">+ autenticarUsuario(): boolean</text><text x="520" y="1088" class="t f">+ autorizarUsuario(): boolean</text>

<!-- Crypto -->
<rect x="900" y="970" width="300" height="170" class="b4"/>
<line x1="900" y1="1012" x2="1200" y2="1012" class="sep"/><line x1="900" y1="1054" x2="1200" y2="1054" class="sep"/>
<text x="1050" y="998" text-anchor="middle" class="t h">SistemaEncriptacion</text>
<text x="920" y="1038" class="t f">- algoritmo: string</text>
<text x="920" y="1081" class="t f">+ cifrarDatos(): string</text><text x="920" y="1103" class="t f">+ descifrarDatos(): string</text>

<!-- Validation -->
<rect x="1260" y="955" width="300" height="190" class="b4"/>
<line x1="1260" y1="997" x2="1560" y2="997" class="sep"/><line x1="1260" y1="1039" x2="1560" y2="1039" class="sep"/>
<text x="1410" y="983" text-anchor="middle" class="t h">ValidacionEntrada</text>
<text x="1280" y="1023" class="t f">- ultimoError: string</text>
<text x="1280" y="1066" class="t f">+ validarTexto(): boolean</text><text x="1280" y="1088" class="t f">+ validarNumero(): boolean</text><text x="1280" y="1110" class="t f">+ validarFecha(): boolean</text>

<!-- Associations -->
<line x1="330" y1="775" x2="730" y2="775" class="rel"/><text x="355" y="760" class="t f">0..*</text><text x="690" y="760" class="t f">1..*</text>
<line x1="680" y1="735" x2="730" y2="735" class="rel"/><text x="690" y="720" class="t f">1</text><text x="710" y="755" class="t f">0..*</text>
<line x1="680" y1="845" x2="1070" y2="845" class="rel"/><text x="690" y="830" class="t f">1</text><text x="1030" y="830" class="t f">0..*</text>
<line x1="1020" y1="780" x2="1070" y2="780" class="rel"/><text x="1025" y="765" class="t f">0..1</text><text x="1050" y="800" class="t f">1</text>
<path d="M415 535 L415 610 L280 610 L280 970" class="rel"/><text x="295" y="950" class="t f">0..*</text>
<path d="M800 285 L800 600 L670 600 L670 955" class="rel"/><text x="685" y="935" class="t f">usa</text>
<line x1="840" y1="1045" x2="900" y2="1045" class="rel"/><text x="850" y="1030" class="t f">1 : 1</text>
<path d="M1190 540 L1190 610 L1410 610 L1410 955" class="dash"/><text x="1420" y="935" class="t f">valida</text>

<text x="45" y="1175" class="t f">Las clases de autenticación, encriptación y validación son complementarias, adaptadas desde la guía de clases.</text>
</svg>