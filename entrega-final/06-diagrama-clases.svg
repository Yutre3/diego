<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<defs>
  <marker id="tri" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
    <path d="M0,0 L0,10 L10,5 z" fill="white" stroke="#444" stroke-width="1.5"/>
  </marker>
  <style>
    .t{font-family:Arial,sans-serif;fill:#222}.title{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.f{font-size:14px}
    .user{fill:#eef2ff;stroke:#5268b7;stroke-width:2}.entity{fill:#eef9f2;stroke:#4f8a63;stroke-width:2}.process{fill:#fff4e8;stroke:#b07946;stroke-width:2}
    .sep{stroke:#555;stroke-width:1.3}.rel{stroke:#555;stroke-width:2;fill:none}.inh{stroke:#555;stroke-width:2;fill:none;marker-end:url(#tri)}
  </style>
</defs>
<rect width="1500" height="980" fill="white"/>
<text x="750" y="40" text-anchor="middle" class="t title">Diagrama de clases - Hotel Duerme Bien</text>

<!-- Usuario -->
<rect x="570" y="80" width="360" height="200" class="user"/>
<line x1="570" y1="122" x2="930" y2="122" class="sep"/>
<line x1="570" y1="205" x2="930" y2="205" class="sep"/>
<text x="750" y="108" text-anchor="middle" class="t h">Usuario</text>
<text x="590" y="148" class="t f">- idUsuario: int</text>
<text x="590" y="170" class="t f">- nombre: string</text>
<text x="590" y="192" class="t f">- rol: string</text>
<text x="590" y="234" class="t f">+ iniciarSesion(): boolean</text>
<text x="590" y="258" class="t f">+ cerrarSesion(): void</text>

<!-- Admin -->
<rect x="260" y="360" width="330" height="170" class="user"/>
<line x1="260" y1="402" x2="590" y2="402" class="sep"/>
<line x1="260" y1="445" x2="590" y2="445" class="sep"/>
<text x="425" y="388" text-anchor="middle" class="t h">Administrador</text>
<text x="280" y="430" class="t f">- permisos: string</text>
<text x="280" y="474" class="t f">+ gestionarUsuarios(): void</text>
<text x="280" y="497" class="t f">+ generarInformes(): void</text>

<!-- Encargado -->
<rect x="910" y="360" width="330" height="170" class="user"/>
<line x1="910" y1="402" x2="1240" y2="402" class="sep"/>
<line x1="910" y1="445" x2="1240" y2="445" class="sep"/>
<text x="1075" y="388" text-anchor="middle" class="t h">EncargadoHotel</text>
<text x="930" y="430" class="t f">- turno: string</text>
<text x="930" y="474" class="t f">+ realizarCheckIn(): void</text>
<text x="930" y="497" class="t f">+ realizarCheckOut(): void</text>

<!-- Inheritance only arrows -->
<path d="M425 360 L425 320 L670 320 L670 280" class="inh"/>
<path d="M1075 360 L1075 320 L830 320 L830 280" class="inh"/>
<text x="750" y="310" text-anchor="middle" class="t f">Herencia / generalización</text>

<!-- Core classes row -->
<rect x="70" y="650" width="300" height="210" class="entity"/>
<line x1="70" y1="692" x2="370" y2="692" class="sep"/>
<line x1="70" y1="795" x2="370" y2="795" class="sep"/>
<text x="220" y="678" text-anchor="middle" class="t h">Huésped</text>
<text x="90" y="720" class="t f">- idHuesped: int</text>
<text x="90" y="743" class="t f">- documento: string</text>
<text x="90" y="766" class="t f">- nombre: string</text>
<text x="90" y="789" class="t f">- apellido: string</text>
<text x="90" y="824" class="t f">+ actualizarDatos(): void</text>

<rect x="410" y="650" width="300" height="210" class="process"/>
<line x1="410" y1="692" x2="710" y2="692" class="sep"/>
<line x1="410" y1="795" x2="710" y2="795" class="sep"/>
<text x="560" y="678" text-anchor="middle" class="t h">Reserva</text>
<text x="430" y="720" class="t f">- idReserva: int</text>
<text x="430" y="743" class="t f">- fechaEntrada: date</text>
<text x="430" y="766" class="t f">- fechaSalida: date</text>
<text x="430" y="789" class="t f">- estado: string</text>
<text x="430" y="824" class="t f">+ crear(): void</text>
<text x="430" y="847" class="t f">+ cancelar(): void</text>

<rect x="750" y="650" width="300" height="210" class="entity"/>
<line x1="750" y1="692" x2="1050" y2="692" class="sep"/>
<line x1="750" y1="795" x2="1050" y2="795" class="sep"/>
<text x="900" y="678" text-anchor="middle" class="t h">Habitación</text>
<text x="770" y="720" class="t f">- idHabitacion: int</text>
<text x="770" y="743" class="t f">- numero: string</text>
<text x="770" y="766" class="t f">- capacidad: int</text>
<text x="770" y="789" class="t f">- estado: string</text>
<text x="770" y="824" class="t f">+ estaDisponible(): boolean</text>
<text x="770" y="847" class="t f">+ cambiarEstado(): void</text>

<rect x="1090" y="650" width="320" height="210" class="process"/>
<line x1="1090" y1="692" x2="1410" y2="692" class="sep"/>
<line x1="1090" y1="795" x2="1410" y2="795" class="sep"/>
<text x="1250" y="678" text-anchor="middle" class="t h">Estadía</text>
<text x="1110" y="720" class="t f">- idEstadia: int</text>
<text x="1110" y="743" class="t f">- checkIn: datetime</text>
<text x="1110" y="766" class="t f">- checkOut: datetime</text>
<text x="1110" y="789" class="t f">- totalCalculado: decimal</text>
<text x="1110" y="824" class="t f">+ calcularCosto(): decimal</text>
<text x="1110" y="847" class="t f">+ finalizar(): void</text>

<!-- Straight, non-crossing associations -->
<line x1="370" y1="755" x2="410" y2="755" class="rel"/>
<text x="374" y="738" class="t f">0..*</text>
<text x="392" y="778" class="t f">1..*</text>

<line x1="710" y1="755" x2="750" y2="755" class="rel"/>
<text x="714" y="738" class="t f">0..*</text>
<text x="736" y="778" class="t f">1</text>

<line x1="1050" y1="755" x2="1090" y2="755" class="rel"/>
<text x="1054" y="738" class="t f">1</text>
<text x="1070" y="778" class="t f">0..*</text>

<text x="750" y="915" text-anchor="middle" class="t f">Las asociaciones se muestran con líneas simples; las únicas flechas son las de herencia hacia Usuario.</text>
</svg>