<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="980" viewBox="0 0 1480 980">
<defs><style>.t{font-family:Arial,sans-serif;fill:#222}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.f{font-size:15px}.box{fill:#fff;stroke:#333;stroke-width:2}.bad{fill:#fff2f2;stroke:#b75555;stroke-width:2}.good{fill:#f2fff5;stroke:#4a8c5d;stroke-width:2}.line{stroke:#555;stroke-width:2;fill:none}</style></defs>
<rect width="1480" height="980" fill="white"/>
<text x="740" y="42" text-anchor="middle" class="t title">Normalización - Sistema de Pasajeros del Hotel</text>

<text x="60" y="95" class="t h">Antes: una tabla con datos mezclados</text>
<rect x="60" y="120" width="1360" height="150" class="bad"/>
<text x="80" y="155" class="t f">RegistroHotel(idRegistro, huésped, documento, habitación, capacidad, orientación, fechaEntrada, fechaSalida,</text>
<text x="80" y="185" class="t f">estadoReserva, checkIn, checkOut, costo, usuario)</text>
<text x="80" y="230" class="t f">Problema: se repiten datos del huésped, habitación y usuario en cada reserva o estadía.</text>

<text x="60" y="325" class="t h">Después: entidades separadas en 3NF</text>

<rect x="60" y="360" width="300" height="160" class="good"/><text x="210" y="392" text-anchor="middle" class="t h">Huesped</text>
<text x="80" y="425" class="t f">PK id_huesped</text><text x="80" y="452" class="t f">documento</text><text x="80" y="479" class="t f">nombre</text><text x="80" y="506" class="t f">apellido</text>

<rect x="420" y="360" width="300" height="180" class="good"/><text x="570" y="392" text-anchor="middle" class="t h">Habitacion</text>
<text x="440" y="425" class="t f">PK id_habitacion</text><text x="440" y="452" class="t f">numero</text><text x="440" y="479" class="t f">capacidad</text><text x="440" y="506" class="t f">orientacion</text><text x="440" y="533" class="t f">estado</text>

<rect x="780" y="360" width="300" height="180" class="good"/><text x="930" y="392" text-anchor="middle" class="t h">Reserva</text>
<text x="800" y="425" class="t f">PK id_reserva</text><text x="800" y="452" class="t f">FK id_habitacion</text><text x="800" y="479" class="t f">fecha_entrada</text><text x="800" y="506" class="t f">fecha_salida</text><text x="800" y="533" class="t f">estado</text>

<rect x="1140" y="360" width="280" height="180" class="good"/><text x="1280" y="392" text-anchor="middle" class="t h">Usuario</text>
<text x="1160" y="425" class="t f">PK id_usuario</text><text x="1160" y="452" class="t f">nombre</text><text x="1160" y="479" class="t f">username</text><text x="1160" y="506" class="t f">rol</text>

<rect x="250" y="650" width="320" height="170" class="good"/><text x="410" y="682" text-anchor="middle" class="t h">Reserva_Huesped</text>
<text x="270" y="720" class="t f">PK/FK id_reserva</text><text x="270" y="750" class="t f">PK/FK id_huesped</text>

<rect x="760" y="640" width="320" height="200" class="good"/><text x="920" y="672" text-anchor="middle" class="t h">Estadia</text>
<text x="780" y="705" class="t f">PK id_estadia</text><text x="780" y="732" class="t f">FK id_habitacion</text><text x="780" y="759" class="t f">checkin</text><text x="780" y="786" class="t f">checkout</text><text x="780" y="813" class="t f">total_calculado</text>

<rect x="1130" y="660" width="290" height="160" class="good"/><text x="1275" y="692" text-anchor="middle" class="t h">Estadia_Huesped</text>
<text x="1150" y="730" class="t f">PK/FK id_estadia</text><text x="1150" y="760" class="t f">PK/FK id_huesped</text>

<line x1="360" y1="455" x2="780" y2="455" class="line"/><text x="540" y="440" class="t f">relación por tabla puente</text>
<line x1="570" y1="540" x2="860" y2="640" class="line"/>
<line x1="930" y1="540" x2="410" y2="650" class="line"/>
<line x1="210" y1="520" x2="410" y2="650" class="line"/>
<line x1="210" y1="520" x2="1275" y2="660" class="line"/>
<line x1="920" y1="640" x2="1275" y2="660" class="line"/>

<text x="60" y="905" class="t f">1NF: campos atómicos. 2NF: atributos dependen de la PK. 3NF: datos de cada entidad se mantienen en su propia tabla.</text>
</svg>