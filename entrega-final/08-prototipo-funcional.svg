<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
<linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#203f5b"/><stop offset="1" stop-color="#2a6070"/></linearGradient>
<style>
.t{font-family:Arial,sans-serif}.title{font-size:24px;font-weight:700}.h{font-size:18px;font-weight:700}.f{font-size:14px}.small{font-size:12px}
.card{fill:#fff;stroke:#d7e0e5;stroke-width:1.5}.field{fill:#f8fafb;stroke:#ccd7dc;stroke-width:1.4}.btn{fill:#2b8798}.nav{fill:#10293f}.muted{fill:#72818a}
</style>
</defs>
<rect width="1400" height="900" fill="#eef3f5"/>
<rect x="0" y="0" width="1400" height="88" fill="url(#head)"/>
<text x="46" y="40" class="t title" fill="#fff">Hotel Duerme Bien</text>
<text x="46" y="63" class="t f" fill="#dce7eb">Sistema de Pasajeros</text>
<text x="1115" y="44" class="t f" fill="#dce7eb">Prototipo funcional</text>

<rect x="0" y="88" width="235" height="812" class="nav"/>
<text x="30" y="135" class="t h" fill="#fff">Menú principal</text>
