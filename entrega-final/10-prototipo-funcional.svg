<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="920" viewBox="0 0 1350 920">
<defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#17324d"/><stop offset="1" stop-color="#245b6b"/></linearGradient><style>.t{font-family:Arial,sans-serif}.title{font-size:26px;font-weight:700}.h{font-size:18px;font-weight:700}.f{font-size:14px}.card{fill:#fff;stroke:#dfe6ea;stroke-width:1.5}.muted{fill:#6a7a86}.btn{fill:#2b8798}.nav{fill:#10293f}</style></defs>
