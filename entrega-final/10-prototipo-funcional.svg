<rect x="750" y="456" width="125" height="38" rx="7" class="btn"/><text x="812" y="480" text-anchor="middle" class="btnText">Seleccionar</text>
<rect x="315" y="545" width="590" height="88" rx="9" fill="#f9fbfc" stroke="#dde5e9"/>
