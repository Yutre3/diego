<text x="335" y="601" class="small">Capacidad: 3 · Orientación: Sur</text>
<rect x="750" y="563" width="125" height="38" rx="7" class="btn"/><text x="812" y="587" text-anchor="middle" class="btnText">Seleccionar</text>

<rect x="965" y="375" width="380" height="390" rx="12" class="card"/>
<text x="995" y="410" class="t h3">Nueva reserva</text>
<text x="995" y="447" class="small">Huésped</text>
<rect x="995" y="458" width="320" height="42" rx="7" class="field"/>
<text x="995" y="530" class="small">Habitación</text>
<rect x="995" y="541" width="320" height="42" rx="7" class="field"/>
<text x="995" y="613" class="small">Entrada / Salida</text>
<rect x="995" y="624" width="320" height="42" rx="7" class="field"/>
<rect x="995" y="695" width="320" height="46" rx="7" class="btn"/><text x="1155" y="724" text-anchor="middle" class="btnText">Guardar reserva</text>

<rect x="285" y="795" width="1060" height="70" rx="10" class="card"/>
<text x="315" y="825" class="t h3">Flujo funcional</text>
<text x="315" y="850" class="small">Consultar → seleccionar habitación → registrar reserva → check-in → check-out → informes</text>
