<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
<style>
.t{font-family:Arial,sans-serif;fill:#24343d}.w{fill:#fff}.small{font-size:14px;fill:#6d7c85}.h1{font-size:25px;font-weight:700}.h2{font-size:27px;font-weight:700}.h3{font-size:17px;font-weight:700}.nav{font-size:14px;fill:#d8e3e8}.btn{fill:#2b8798}.btnText{font-size:13px;fill:#fff}.line{stroke:#d7e0e5;stroke-width:1.5}.field{fill:#f8fafb;stroke:#ccd7dc;stroke-width:1.5}.card{fill:#fff;stroke:#d7e0e5;stroke-width:1.5}</style>
</defs>
<rect width="1400" height="900" fill="#eef3f5"/>
<rect x="0" y="0" width="1400" height="92" fill="#23465f"/>
<text x="48" y="42" class="t h1" fill="#fff">Hotel Duerme Bien</text>
<text x="48" y="66" class="small" fill="#dce7eb">Prototipo funcional · Sistema de Pasajeros</text>
<text x="1090" y="49" class="small" fill="#dce7eb">Administrador / Encargado</text>
<rect x="1235" y="27" width="115" height="38" rx="19" fill="#ffffff22"/>
<text x="1292" y="51" text-anchor="middle" class="btnText">Reiniciar demo</text>

<rect x="0" y="92" width="235" height="808" fill="#10293f"/>
<text x="28" y="135" class="t h3" fill="#fff">Menú principal</text>
<text x="32" y="185" class="nav">Inicio</text>
<text x="32" y="230" class="nav">Habitaciones</text>
<text x="32" y="275" class="nav">Huéspedes</text>
