<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3b4650"/></marker>
<style>
.t{font-family:Arial,sans-serif;fill:#24343d}.title{font-size:28px;font-weight:700}.label{font-size:18px}.small{font-size:14px}
.sys{fill:#fff;stroke:#60717b;stroke-width:2}.uc{fill:#fff;stroke:#3d6674;stroke-width:2}.assoc{stroke:#667984;stroke-width:2;fill:none}.dep{stroke:#3b4650;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}.tag{fill:#fff;stroke:#d8e1e5;stroke-width:1}
</style>
</defs>
<rect width="1400" height="900" fill="#fff"/>
<text x="700" y="42" text-anchor="middle" class="t title">Diagrama de casos de uso - Hotel Duerme Bien</text>

<rect x="270" y="75" width="1060" height="765" rx="10" class="sys"/>
<text x="300" y="112" class="t label" font-weight="700">Sistema de Pasajeros</text>

<!-- Actores -->
<g>
  <circle cx="120" cy="205" r="22" fill="#fff" stroke="#46555f" stroke-width="2"/>
  <line x1="120" y1="227" x2="120" y2="295" class="assoc"/>
  <line x1="82" y1="252" x2="158" y2="252" class="assoc"/>
  <line x1="120" y1="295" x2="88" y2="345" class="assoc"/>
  <line x1="120" y1="295" x2="152" y2="345" class="assoc"/>
  <text x="120" y="380" text-anchor="middle" class="t label">Administrador</text>
</g>
<g>
  <circle cx="120" cy="555" r="22" fill="#fff" stroke="#46555f" stroke-width="2"/>
  <line x1="120" y1="577" x2="120" y2="645" class="assoc"/>
  <line x1="82" y1="602" x2="158" y2="602" class="assoc"/>
  <line x1="120" y1="645" x2="88" y2="695" class="assoc"/>
  <line x1="120" y1="645" x2="152" y2="695" class="assoc"/>
  <text x="120" y="730" text-anchor="middle" class="t label">Encargado</text>
</g>

<!-- Casos de uso principales -->
<ellipse cx="520" cy="165" rx="145" ry="42" class="uc"/><text x="520" y="172" text-anchor="middle" class="t label">Gestionar habitaciones</text>
<ellipse cx="520" cy="260" rx="135" ry="42" class="uc"/><text x="520" y="267" text-anchor="middle" class="t label">Gestionar usuarios</text>
