<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs>
  <marker id="arr" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#3e5059"/></marker>
  <style>
    .t{font-family:Arial,sans-serif;fill:#26343d}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#6d7b83}.lab{font-size:18px}.small{font-size:14px}
    .sys{fill:#fff;stroke:#657781;stroke-width:2.4}.uc{fill:#fff;stroke:#2d737a;stroke-width:2.2}.actor{stroke:#445761;stroke-width:2.2;fill:none}
    .assoc{stroke:#596d77;stroke-width:2.1;fill:none}.inc{stroke:#3e5059;stroke-width:2.1;stroke-dasharray:10 7;fill:none;marker-end:url(#arr)}
    .tag{fill:#fff;stroke:#dae2e6;stroke-width:1}
  </style>
</defs>
<rect width="1600" height="1120" fill="#fff"/>
<text x="800" y="48" text-anchor="middle" class="t title">Diagrama de casos de uso</text>
<text x="800" y="78" text-anchor="middle" class="t sub">Sistema de Pasajeros · Hotel Duerme Bien</text>
<rect x="300" y="115" width="1220" height="900" rx="14" class="sys"/>
<text x="330" y="155" class="t lab" font-weight="700">Sistema de Pasajeros</text>

<circle cx="135" cy="245" r="25" class="actor"/><line x1="135" y1="270" x2="135" y2="350" class="actor"/><line x1="90" y1="305" x2="180" y2="305" class="actor"/><line x1="135" y1="350" x2="98" y2="410" class="actor"/><line x1="135" y1="350" x2="172" y2="410" class="actor"/><text x="135" y="450" text-anchor="middle" class="t lab">Administrador</text>
