<ellipse cx="1000" cy="960" rx="145" ry="44" class="uc"/><text x="1000" y="954" text-anchor="middle" class="t lab">Calcular costo</text><text x="1000" y="978" text-anchor="middle" class="t small">por pasajero</text>
