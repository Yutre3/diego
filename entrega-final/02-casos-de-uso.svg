<ellipse cx="1030" cy="665" rx="145" ry="42" class="uc"/><text x="1030" y="672" text-anchor="middle" class="t label">Asignar habitación</text>
<ellipse cx="930" cy="760" rx="125" ry="42" class="uc"/><text x="930" y="767" text-anchor="middle" class="t label">Calcular costo</text>
<ellipse cx="1180" cy="760" rx="135" ry="42" class="uc"/><text x="1180" y="767" text-anchor="middle" class="t label">Liberar habitación</text>

<!-- Asociaciones -->
<line x1="158" y1="245" x2="375" y2="175" class="assoc"/>
<line x1="158" y1="260" x2="385" y2="260" class="assoc"/>
<line x1="158" y1="278" x2="390" y2="345" class="assoc"/>

