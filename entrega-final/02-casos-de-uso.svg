<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#26343d}.title{font-size:30px;font-weight:700}.label{font-size:18px}.small{font-size:13px}
.sys{fill:#fff;stroke:#63747d;stroke-width:2.2}.uc{fill:#fff;stroke:#2e747b;stroke-width:2.1}
.actor{stroke:#4b5d66;stroke-width:2.1;fill:none}.assoc{stroke:#5c6f78;stroke-width:2;fill:none}
.rolebox{fill:#f7f9fa;stroke:#dbe3e7;stroke-width:1.2}
</style></defs>
<rect width="1500" height="980" fill="#fff"/>
<text x="750" y="48" text-anchor="middle" class="t title">Diagrama de casos de uso</text>

<rect x="330" y="95" width="1100" height="820" rx="12" class="sys"/>
<text x="360" y="135" class="t label" font-weight="700">Sistema de Pasajeros</text>

<!-- Actor -->
<circle cx="145" cy="430" r="24" class="actor"/>
<line x1="145" y1="454" x2="145" y2="525" class="actor"/>
<line x1="102" y1="482" x2="188" y2="482" class="actor"/>
<line x1="145" y1="525" x2="110" y2="575" class="actor"/>
<line x1="145" y1="525" x2="180" y2="575" class="actor"/>
<text x="145" y="615" text-anchor="middle" class="t label">Personal del hotel</text>
<rect x="55" y="635" width="180" height="58" rx="8" class="rolebox"/>
<text x="145" y="659" text-anchor="middle" class="t small">Perfiles definidos:</text>
<text x="145" y="681" text-anchor="middle" class="t small" font-weight="700">Administrador · Encargado</text>

<!-- Casos columna 1 -->
<ellipse cx="600" cy="185" rx="165" ry="45" class="uc"/><text x="600" y="192" text-anchor="middle" class="t label">Registrar habitaciones</text>
<ellipse cx="600" cy="300" rx="200" ry="45" class="uc"/><text x="600" y="307" text-anchor="middle" class="t label">Registrar huésped y asignar habitación</text>
<ellipse cx="600" cy="415" rx="180" ry="45" class="uc"/><text x="600" y="422" text-anchor="middle" class="t label">Consultar ocupación y disponibilidad</text>
<ellipse cx="600" cy="530" rx="155" ry="45" class="uc"/><text x="600" y="537" text-anchor="middle" class="t label">Gestionar reservas</text>
<ellipse cx="600" cy="645" rx="195" ry="45" class="uc"/><text x="600" y="652" text-anchor="middle" class="t label">Realizar check-in y asignar habitación</text>

<!-- Casos columna 2 -->
<ellipse cx="1110" cy="240" rx="195" ry="45" class="uc"/><text x="1110" y="247" text-anchor="middle" class="t label">Realizar check-out y liberar habitación</text>
<ellipse cx="1110" cy="385" rx="165" ry="45" class="uc"/><text x="1110" y="392" text-anchor="middle" class="t label">Calcular costo por pasajero</text>
<ellipse cx="1110" cy="530" rx="150" ry="45" class="uc"/><text x="1110" y="537" text-anchor="middle" class="t label">Gestionar usuarios</text>
<ellipse cx="1110" cy="675" rx="205" ry="45" class="uc"/><text x="1110" y="682" text-anchor="middle" class="t label">Generar informes de ocupación y reservas</text>

<!-- Asociaciones sin cruces -->
<path d="M188 482 H285 V185 H435" class="assoc"/>
<path d="M188 492 H300 V300 H400" class="assoc"/>
<path d="M188 502 H315 V415 H420" class="assoc"/>
<path d="M188 512 H315 V530 H445" class="assoc"/>
<path d="M188 522 H300 V645 H405" class="assoc"/>

<path d="M188 532 H265 V760 H875 V240 H915" class="assoc"/>
<path d="M188 542 H250 V790 H900 V385 H945" class="assoc"/>
<path d="M188 552 H235 V820 H920 V530 H960" class="assoc"/>
<path d="M188 562 H220 V850 H900 V675 H905" class="assoc"/>
</svg>