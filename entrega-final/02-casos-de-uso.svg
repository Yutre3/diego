<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#26343d}.title{font-size:30px;font-weight:700}.label{font-size:18px}.small{font-size:13px}
.sys{fill:#fff;stroke:#63747d;stroke-width:2.2}.uc{fill:#fff;stroke:#2e747b;stroke-width:2.1}
.actor{stroke:#4b5d66;stroke-width:2.1;fill:none}.assoc{stroke:#667983;stroke-width:1.9;fill:none}.role{fill:#f7f9fa;stroke:#d9e2e6;stroke-width:1.2}
</style></defs>
<rect width="1500" height="940" fill="#fff"/>
<text x="750" y="46" text-anchor="middle" class="t title">Diagrama de casos de uso</text>

<rect x="340" y="90" width="1100" height="790" rx="12" class="sys"/>
<text x="370" y="130" class="t label" font-weight="700">Sistema de Pasajeros</text>

<!-- Actor -->
<circle cx="150" cy="400" r="24" class="actor"/>
<line x1="150" y1="424" x2="150" y2="495" class="actor"/>
<line x1="108" y1="452" x2="192" y2="452" class="actor"/>
<line x1="150" y1="495" x2="116" y2="545" class="actor"/>
<line x1="150" y1="495" x2="184" y2="545" class="actor"/>
<text x="150" y="585" text-anchor="middle" class="t label">Personal del hotel</text>
<rect x="62" y="610" width="176" height="58" rx="8" class="role"/>
<text x="150" y="634" text-anchor="middle" class="t small">Perfiles:</text>
<text x="150" y="656" text-anchor="middle" class="t small" font-weight="700">Administrador · Encargado</text>

<!-- Use cases -->
<ellipse cx="590" cy="190" rx="165" ry="44" class="uc"/><text x="590" y="197" text-anchor="middle" class="t label">Registrar habitaciones</text>
<ellipse cx="590" cy="320" rx="200" ry="44" class="uc"/><text x="590" y="327" text-anchor="middle" class="t label">Registrar huésped y asignar habitación</text>
<ellipse cx="590" cy="450" rx="180" ry="44" class="uc"/><text x="590" y="457" text-anchor="middle" class="t label">Controlar ocupación y disponibilidad</text>
<ellipse cx="590" cy="580" rx="160" ry="44" class="uc"/><text x="590" y="587" text-anchor="middle" class="t label">Gestionar reservas</text>
<ellipse cx="590" cy="710" rx="190" ry="44" class="uc"/><text x="590" y="717" text-anchor="middle" class="t label">Realizar check-in y asignar habitación</text>

<ellipse cx="1110" cy="220" rx="195" ry="44" class="uc"/><text x="1110" y="227" text-anchor="middle" class="t label">Realizar check-out y liberar habitación</text>
<ellipse cx="1110" cy="365" rx="165" ry="44" class="uc"/><text x="1110" y="372" text-anchor="middle" class="t label">Calcular costo por pasajero</text>
<ellipse cx="1110" cy="510" rx="150" ry="44" class="uc"/><text x="1110" y="517" text-anchor="middle" class="t label">Gestionar usuarios</text>
<ellipse cx="1110" cy="655" rx="205" ry="44" class="uc"/><text x="1110" y="662" text-anchor="middle" class="t label">Generar informes de ocupación y reservas</text>

