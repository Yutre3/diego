<rect x="355" y="620" width="1110" height="210" rx="10" class="note"/>
<text x="385" y="660" class="t small" font-weight="700">Lectura del diagrama</text>
<text x="385" y="692" class="t small">• El Caso 6 define dos perfiles: Administrador y Encargado de hotel.</text>
<text x="385" y="724" class="t small">• El caso no separa permisos exactos por perfil, por eso ambos se muestran como tipos de Usuario del sistema.</text>
<text x="385" y="756" class="t small">• Los óvalos corresponden a las funciones y procesos indicados en el Caso 6.</text>
