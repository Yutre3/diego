<path d="M500 217 H1415" class="group-line"/>
<text x="500" y="973" class="group-heading">ADMINISTRACIÓN</text>
<path d="M500 987 H1415" class="group-line"/>
<path class="association assoc-enc" d="M244 475 L758 250"/><path class="association assoc-enc" d="M244 490 L758 370"/><path class="association assoc-enc" d="M244 505 L758 490"/><path class="association assoc-enc" d="M244 520 L758 610"/><path class="association assoc-enc" d="M244 535 L758 730"/><path class="association assoc-enc" d="M244 550 L758 850"/><path class="association assoc-admin" d="M244 1110 L758 1035"/><path class="association assoc-admin" d="M244 1125 L758 1140"/><path class="association assoc-admin" d="M244 1140 L758 1245"/><ellipse class="case operation" cx="1039" cy="250" rx="281" ry="39"/><text class="case-name" x="1039" y="257" text-anchor="middle">Registrar huésped y asignar habitación</text><ellipse class="case operation" cx="1039" cy="370" rx="281" ry="39"/><text class="case-name" x="1039" y="377" text-anchor="middle">Controlar ocupación y disponibilidad</text><ellipse class="case operation" cx="1039" cy="490" rx="281" ry="39"/><text class="case-name" x="1039" y="497" text-anchor="middle">Gestionar reservas</text><ellipse class="case operation" cx="1039" cy="610" rx="281" ry="39"/><text class="case-name" x="1039" y="617" text-anchor="middle">Realizar check-in</text><ellipse class="case operation" cx="1039" cy="730" rx="281" ry="39"/><text class="case-name" x="1039" y="737" text-anchor="middle">Realizar check-out</text><ellipse class="case operation" cx="1039" cy="850" rx="281" ry="39"/><text class="case-name" x="1039" y="857" text-anchor="middle">Calcular costo por pasajero</text><ellipse class="case administration" cx="1039" cy="1035" rx="281" ry="39"/><text class="case-name" x="1039" y="1042" text-anchor="middle">Registrar habitaciones</text><ellipse class="case administration" cx="1039" cy="1140" rx="281" ry="39"/><text class="case-name" x="1039" y="1147" text-anchor="middle">Gestionar usuarios</text><ellipse class="case administration" cx="1039" cy="1245" rx="281" ry="39"/><text class="case-name" x="1039" y="1252" text-anchor="middle">Generar informes de ocupación y reservas</text><g class="stick" stroke="#598fa0"><circle cx="187" cy="460" r="21"/><path d="M187 481 V555 M147 509 H227 M187 555 L155 603 M187 555 L219 603"/></g><text class="actor-name" x="187" y="637" text-anchor="middle">Encargado</text><g class="stick" stroke="#8496ac"><circle cx="187" cy="1080" r="21"/><path d="M187 1101 V1175 M147 1129 H227 M187 1175 L155 1223 M187 1175 L219 1223"/></g><text class="actor-name" x="187" y="1257" text-anchor="middle">Administrador</text><text x="187" y="1311" text-anchor="middle" class="helper">El administrador también puede</text><text x="187" y="1332" text-anchor="middle" class="helper">realizar tareas del encargado.</text><text x="499" y="1375" class="helper">Línea continua: asociación entre el actor y el caso de uso</text></svg>