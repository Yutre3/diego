<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1400" viewBox="0 0 1500 1400" role="img" aria-labelledby="uml-title uml-desc">
<title id="uml-title">Diagrama de casos de uso — Hotel Duerme Bien</title>
<desc id="uml-desc">Casos de uso divididos en operación del hotel y administración, con nueve óvalos distribuidos uniformemente y asociaciones claras entre cada actor y las funcionalidades de su perfil.</desc>
<defs><style>
  .heading{font:700 32px Arial,Helvetica,sans-serif;fill:#183c4c}
  .subtitle{font:17px Arial,Helvetica,sans-serif;fill:#647985}
  .boundary{fill:#fff;stroke:#637c88;stroke-width:2}
  .system-title{font:700 22px Arial,Helvetica,sans-serif;fill:#244959}
  .group-heading{font:700 16px Arial,Helvetica,sans-serif;letter-spacing:1.1px;fill:#497585}
  .group-line{stroke:#e2ebef;stroke-width:1.5}
  .actor-name{font:700 20px Arial,Helvetica,sans-serif;fill:#2a4553}
  .stick{stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .operation{fill:#f6fbfd;stroke:#397e8e}
  .administration{fill:#fafbfd;stroke:#697e94}
  .case{stroke-width:2.3}
  .case-name{font:19px Arial,Helvetica,sans-serif;fill:#243e4b}
  .assoc-enc{stroke:#598fa0}
  .assoc-admin{stroke:#8496ac}
  .association{stroke-width:2.3;fill:none;stroke-linecap:round}
  .helper{font:15px Arial,Helvetica,sans-serif;fill:#58717d}
</style></defs>
<rect width="1500" height="1400" fill="#ffffff"/>
<text x="750" y="58" class="heading" text-anchor="middle">Diagrama de casos de uso</text>
<text x="750" y="87" class="subtitle" text-anchor="middle">Hotel Duerme Bien · Sistema de pasajeros</text>
