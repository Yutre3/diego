<ellipse cx="560" cy="230" rx="175" ry="48" class="uc"/><text x="560" y="224" text-anchor="middle" class="t lab">Gestionar habitaciones</text><text x="560" y="248" text-anchor="middle" class="t small">capacidad y orientación</text>
