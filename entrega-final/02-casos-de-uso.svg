<line x1="192" y1="452" x2="390" y2="320" class="assoc"/>
<line x1="192" y1="452" x2="410" y2="450" class="assoc"/>
<line x1="192" y1="452" x2="430" y2="580" class="assoc"/>
<line x1="192" y1="452" x2="400" y2="710" class="assoc"/>

