<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940">
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#40515b"/></marker>
<style>
.t{font-family:Arial,sans-serif;fill:#26343d}.title{font-size:30px;font-weight:700}.label{font-size:18px}.small{font-size:13px}
.sys{fill:#fff;stroke:#667780;stroke-width:2.2}.uc{fill:#fff;stroke:#2f747a;stroke-width:2.1}
.actor{stroke:#4c5d66;stroke-width:2.1;fill:none}.assoc{stroke:#657780;stroke-width:1.9;fill:none}
.inc{stroke:#40515b;stroke-width:2;stroke-dasharray:9 6;fill:none;marker-end:url(#arr)}
.note{fill:#f7f9fa;stroke:#dce4e8}
</style>
</defs>
<rect width="1500" height="940" fill="#fff"/>
<text x="750" y="48" text-anchor="middle" class="t title">Diagrama de casos de uso</text>

<rect x="315" y="90" width="1110" height="790" rx="12" class="sys"/>
<text x="345" y="130" class="t label" font-weight="700">Sistema de Pasajeros</text>

<!-- Actor -->
<circle cx="140" cy="390" r="24" class="actor"/>
<line x1="140" y1="414" x2="140" y2="486" class="actor"/>
<line x1="98" y1="442" x2="182" y2="442" class="actor"/>
<line x1="140" y1="486" x2="106" y2="536" class="actor"/>
<line x1="140" y1="486" x2="174" y2="536" class="actor"/>
<text x="140" y="576" text-anchor="middle" class="t label">Personal del hotel</text>
<rect x="45" y="600" width="190" height="58" rx="8" class="note"/>
<text x="140" y="624" text-anchor="middle" class="t small">Perfiles del caso:</text>
<text x="140" y="647" text-anchor="middle" class="t small" font-weight="700">Administrador · Encargado</text>

<!-- Casos de uso -->
<ellipse cx="585" cy="190" rx="155" ry="44" class="uc"/><text x="585" y="197" text-anchor="middle" class="t label">Registrar habitaciones</text>
<ellipse cx="585" cy="300" rx="185" ry="44" class="uc"/><text x="585" y="307" text-anchor="middle" class="t label">Registrar huésped y asignar habitación</text>
<ellipse cx="585" cy="410" rx="185" ry="44" class="uc"/><text x="585" y="417" text-anchor="middle" class="t label">Controlar ocupación y disponibilidad</text>
<ellipse cx="585" cy="520" rx="145" ry="44" class="uc"/><text x="585" y="527" text-anchor="middle" class="t label">Gestionar reservas</text>
<ellipse cx="585" cy="630" rx="175" ry="44" class="uc"/><text x="585" y="637" text-anchor="middle" class="t label">Realizar check-in</text>
<ellipse cx="585" cy="740" rx="175" ry="44" class="uc"/><text x="585" y="747" text-anchor="middle" class="t label">Realizar check-out</text>

<ellipse cx="1090" cy="245" rx="165" ry="44" class="uc"/><text x="1090" y="252" text-anchor="middle" class="t label">Calcular costo por pasajero</text>
<ellipse cx="1090" cy="385" rx="145" ry="44" class="uc"/><text x="1090" y="392" text-anchor="middle" class="t label">Gestionar usuarios</text>
<ellipse cx="1090" cy="525" rx="195" ry="44" class="uc"/><text x="1090" y="532" text-anchor="middle" class="t label">Generar informes de ocupación y reservas</text>
<ellipse cx="1090" cy="665" rx="165" ry="44" class="uc"/><text x="1090" y="672" text-anchor="middle" class="t label">Consultar disponibilidad</text>

<!-- Asociaciones simples -->
<line x1="182" y1="442" x2="430" y2="190" class="assoc"/>
<line x1="182" y1="442" x2="400" y2="300" class="assoc"/>
<line x1="182" y1="442" x2="400" y2="410" class="assoc"/>
<line x1="182" y1="442" x2="440" y2="520" class="assoc"/>
<line x1="182" y1="442" x2="410" y2="630" class="assoc"/>
<line x1="182" y1="442" x2="410" y2="740" class="assoc"/>
<line x1="182" y1="442" x2="925" y2="245" class="assoc"/>
<line x1="182" y1="442" x2="945" y2="385" class="assoc"/>
<line x1="182" y1="442" x2="895" y2="525" class="assoc"/>

<!-- include mínimo -->
<path d="M730 520 H850 V665 H925" class="inc"/>
<text x="815" y="505" text-anchor="middle" class="t small">&lt;&lt;include&gt;&gt;</text>
<path d="M760 740 H850 V245 H925" class="inc"/>
<text x="820" y="725" text-anchor="middle" class="t small">&lt;&lt;include&gt;&gt;</text>
</svg>