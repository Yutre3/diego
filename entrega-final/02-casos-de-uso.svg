<ellipse cx="520" cy="475" rx="135" ry="42" class="uc"/><text x="520" y="482" text-anchor="middle" class="t label">Registrar huésped</text>
<ellipse cx="520" cy="570" rx="135" ry="42" class="uc"/><text x="520" y="577" text-anchor="middle" class="t label">Gestionar reserva</text>
<ellipse cx="520" cy="665" rx="135" ry="42" class="uc"/><text x="520" y="672" text-anchor="middle" class="t label">Realizar check-in</text>
<ellipse cx="520" cy="760" rx="135" ry="42" class="uc"/><text x="520" y="767" text-anchor="middle" class="t label">Realizar check-out</text>

