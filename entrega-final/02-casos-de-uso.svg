<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#364851"/></marker>
  <style>
    .t{font-family:Arial,sans-serif;fill:#25343c}.title{font-size:31px;font-weight:700}.sub{font-size:15px;fill:#6d7b83}.lab{font-size:18px}.small{font-size:13px}
    .system{fill:#fff;stroke:#697982;stroke-width:2.2}.uc{fill:#fff;stroke:#2e737a;stroke-width:2.1}
    .actor{stroke:#465861;stroke-width:2.1;fill:none}.assoc{stroke:#5c6e77;stroke-width:2.1;fill:none}
    .inc{stroke:#364851;stroke-width:2;stroke-dasharray:9 6;fill:none;marker-end:url(#arr)}
    .tag{fill:#fff;stroke:#d8e1e5;stroke-width:1}
  </style>
</defs>
<rect width="1500" height="1040" fill="#fff"/>
<text x="750" y="44" text-anchor="middle" class="t title">Diagrama de casos de uso</text>
<text x="750" y="72" text-anchor="middle" class="t sub">Sistema de Pasajeros · Hotel Duerme Bien</text>

<rect x="285" y="105" width="1135" height="835" rx="12" class="system"/>
<text x="315" y="145" class="t lab" font-weight="700">Sistema de Pasajeros</text>

<!-- Actores -->
<circle cx="120" cy="255" r="24" class="actor"/>
<line x1="120" y1="279" x2="120" y2="350" class="actor"/>
<line x1="78" y1="305" x2="162" y2="305" class="actor"/>
<line x1="120" y1="350" x2="86" y2="400" class="actor"/>
<line x1="120" y1="350" x2="154" y2="400" class="actor"/>
<text x="120" y="438" text-anchor="middle" class="t lab">Administrador</text>

<circle cx="120" cy="635" r="24" class="actor"/>
<line x1="120" y1="659" x2="120" y2="730" class="actor"/>
<line x1="78" y1="685" x2="162" y2="685" class="actor"/>
<line x1="120" y1="730" x2="86" y2="780" class="actor"/>
<line x1="120" y1="730" x2="154" y2="780" class="actor"/>
<text x="120" y="818" text-anchor="middle" class="t lab">Encargado de hotel</text>

<!-- Casos admin -->
<ellipse cx="535" cy="225" rx="155" ry="46" class="uc"/><text x="535" y="232" text-anchor="middle" class="t lab">Gestionar habitaciones</text>
<ellipse cx="535" cy="335" rx="145" ry="46" class="uc"/><text x="535" y="342" text-anchor="middle" class="t lab">Gestionar usuarios</text>
<ellipse cx="535" cy="445" rx="135" ry="46" class="uc"/><text x="535" y="452" text-anchor="middle" class="t lab">Generar informes</text>

<!-- Casos encargado -->
<ellipse cx="535" cy="580" rx="140" ry="46" class="uc"/><text x="535" y="587" text-anchor="middle" class="t lab">Registrar huésped</text>
<ellipse cx="535" cy="690" rx="140" ry="46" class="uc"/><text x="535" y="697" text-anchor="middle" class="t lab">Gestionar reserva</text>
<ellipse cx="535" cy="800" rx="140" ry="46" class="uc"/><text x="535" y="807" text-anchor="middle" class="t lab">Realizar check-in</text>
<ellipse cx="535" cy="895" rx="140" ry="46" class="uc"/><text x="535" y="902" text-anchor="middle" class="t lab">Realizar check-out</text>

<!-- Incluidos -->
<ellipse cx="1040" cy="690" rx="175" ry="46" class="uc"/><text x="1040" y="697" text-anchor="middle" class="t lab">Consultar disponibilidad</text>
<ellipse cx="1040" cy="800" rx="150" ry="46" class="uc"/><text x="1040" y="807" text-anchor="middle" class="t lab">Asignar habitación</text>
<ellipse cx="935" cy="900" rx="125" ry="42" class="uc"/><text x="935" y="907" text-anchor="middle" class="t lab">Calcular costo</text>
<ellipse cx="1215" cy="900" rx="135" ry="42" class="uc"/><text x="1215" y="907" text-anchor="middle" class="t lab">Liberar habitación</text>

<!-- Asociaciones -->
<path d="M162 305 H275 V225 H380" class="assoc"/>
<path d="M162 315 H295 V335 H390" class="assoc"/>
<path d="M162 325 H275 V445 H400" class="assoc"/>

<path d="M162 685 H275 V580 H395" class="assoc"/>
<path d="M162 695 H300 V690 H395" class="assoc"/>
<path d="M162 705 H280 V800 H395" class="assoc"/>
<path d="M162 715 H260 V895 H395" class="assoc"/>

<!-- Includes -->
<path d="M675 690 H865" class="inc"/>
<rect x="728" y="656" width="120" height="27" rx="5" class="tag"/><text x="788" y="675" text-anchor="middle" class="t small">&lt;&lt;include&gt;&gt;</text>

<path d="M675 800 H890" class="inc"/>
<rect x="738" y="766" width="120" height="27" rx="5" class="tag"/><text x="798" y="785" text-anchor="middle" class="t small">&lt;&lt;include&gt;&gt;</text>

<path d="M675 885 H780 V900 H810" class="inc"/>
<rect x="698" y="851" width="120" height="27" rx="5" class="tag"/><text x="758" y="870" text-anchor="middle" class="t small">&lt;&lt;include&gt;&gt;</text>

<path d="M675 910 H1080" class="inc"/>
<rect x="850" y="876" width="120" height="27" rx="5" class="tag"/><text x="910" y="895" text-anchor="middle" class="t small">&lt;&lt;include&gt;&gt;</text>

<rect x="315" y="962" width="1075" height="50" rx="9" fill="#f7f9fa" stroke="#dce4e8"/>
<text x="338" y="993" class="t small">Línea continua: actor asociado a una función · Flecha discontinua: la función incluye otra operación necesaria.</text>
</svg>