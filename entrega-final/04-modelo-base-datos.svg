<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#24343d}.title{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.f{font-size:15px}
.box{fill:#fff;stroke:#465863;stroke-width:2}.head{fill:#eef3f5;stroke:#465863;stroke-width:2}.rel{stroke:#536773;stroke-width:2.2;fill:none}.badge{fill:#fff;stroke:#d6e0e4}
</style></defs>
<rect width="1400" height="900" fill="#fff"/>
<text x="700" y="42" text-anchor="middle" class="t title">Modelo de base de datos - Hotel Duerme Bien</text>

<!-- Usuario, separado -->
<rect x="80" y="130" width="250" height="190" rx="8" class="box"/><rect x="80" y="130" width="250" height="42" rx="8" class="head"/>
<text x="205" y="158" text-anchor="middle" class="t h">Usuario</text>
<text x="105" y="205" class="t f">PK id_usuario</text><text x="105" y="235" class="t f">nombre</text><text x="105" y="265" class="t f">rol</text><text x="105" y="295" class="t f">activo *</text>

<!-- Huesped -->
<rect x="575" y="100" width="250" height="175" rx="8" class="box"/><rect x="575" y="100" width="250" height="42" rx="8" class="head"/>
<text x="700" y="128" text-anchor="middle" class="t h">Huésped</text>
<text x="600" y="175" class="t f">PK id_huesped</text><text x="600" y="205" class="t f">nombre *</text><text x="600" y="235" class="t f">otros_datos *</text>

<!-- Habitacion -->
<rect x="1070" y="100" width="250" height="205" rx="8" class="box"/><rect x="1070" y="100" width="250" height="42" rx="8" class="head"/>
<text x="1195" y="128" text-anchor="middle" class="t h">Habitación</text>
<text x="1095" y="175" class="t f">PK id_habitacion</text><text x="1095" y="205" class="t f">capacidad</text><text x="1095" y="235" class="t f">orientación</text><text x="1095" y="265" class="t f">estado *</text>

<!-- Reserva -->
<rect x="410" y="500" width="330" height="255" rx="8" class="box"/><rect x="410" y="500" width="330" height="42" rx="8" class="head"/>
<text x="575" y="528" text-anchor="middle" class="t h">Reserva</text>
<text x="435" y="575" class="t f">PK id_reserva</text><text x="435" y="605" class="t f">FK id_huesped</text><text x="435" y="635" class="t f">FK id_habitacion</text><text x="435" y="665" class="t f">fecha_entrada *</text><text x="435" y="695" class="t f">fecha_salida *</text><text x="435" y="725" class="t f">estado *</text>

<!-- Estadia -->
<rect x="880" y="500" width="330" height="285" rx="8" class="box"/><rect x="880" y="500" width="330" height="42" rx="8" class="head"/>
<text x="1045" y="528" text-anchor="middle" class="t h">Estadía</text>
<text x="905" y="575" class="t f">PK id_estadia</text><text x="905" y="605" class="t f">FK id_huesped</text><text x="905" y="635" class="t f">FK id_habitacion</text><text x="905" y="665" class="t f">checkin</text><text x="905" y="695" class="t f">checkout</text><text x="905" y="725" class="t f">cantidad_pasajeros *</text><text x="905" y="755" class="t f">costo_total *</text>

<!-- Relaciones sin cruces -->
<path d="M650 275 V390 H575 V500" class="rel"/>
<rect x="560" y="376" width="70" height="26" rx="5" class="badge"/><text x="595" y="394" text-anchor="middle" class="t f">1 : N</text>

<path d="M750 275 V390 H1045 V500" class="rel"/>
<rect x="850" y="376" width="70" height="26" rx="5" class="badge"/><text x="885" y="394" text-anchor="middle" class="t f">1 : N</text>

<path d="M1140 305 V420 H690 V500" class="rel"/>
<rect x="1030" y="407" width="70" height="26" rx="5" class="badge"/><text x="1065" y="425" text-anchor="middle" class="t f">1 : N</text>

<path d="M1240 305 V450 H1120 V500" class="rel"/>
<rect x="1160" y="438" width="70" height="26" rx="5" class="badge"/><text x="1195" y="456" text-anchor="middle" class="t f">1 : N</text>

<!-- Usuario administra registros, sin forzar FK no definida -->
<path d="M205 320 V400 H410" class="rel"/>
<text x="230" y="385" class="t f">gestiona</text>

<text x="80" y="850" class="t f">* Campo de diseño del prototipo pendiente de validación porque el Caso 6 no lo define de forma exacta.</text>
</svg>