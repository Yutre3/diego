<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="980" viewBox="0 0 1450 980">
<defs><style>.t{font-family:Arial,sans-serif;fill:#222}.title{font-size:30px;font-weight:700}.h{font-size:19px;font-weight:700}.f{font-size:15px}.box{fill:#fff;stroke:#333;stroke-width:2}.head{fill:#f0f0f0;stroke:#333;stroke-width:2}.rel{stroke:#555;stroke-width:2.2;fill:none}.lbl{fill:white;stroke:#ddd;stroke-width:1}</style></defs>
<rect width="1450" height="980" fill="white"/>
<text x="725" y="42" text-anchor="middle" class="t title">Modelo de base de datos - Hotel Duerme Bien</text>

<rect x="80" y="360" width="260" height="190" rx="7" class="box"/><rect x="80" y="360" width="260" height="42" rx="7" class="head"/><text x="210" y="387" text-anchor="middle" class="t h">Usuario</text>
<text x="102" y="432" class="t f">PK id_usuario</text><text x="102" y="460" class="t f">nombre</text><text x="102" y="488" class="t f">rol</text><text x="102" y="516" class="t f">activo *</text>

<rect x="585" y="85" width="280" height="205" rx="7" class="box"/><rect x="585" y="85" width="280" height="42" rx="7" class="head"/><text x="725" y="112" text-anchor="middle" class="t h">Habitación</text>
<text x="607" y="155" class="t f">PK id_habitacion</text><text x="607" y="183" class="t f">capacidad</text><text x="607" y="211" class="t f">orientacion</text><text x="607" y="239" class="t f">estado *</text>

<rect x="585" y="745" width="280" height="175" rx="7" class="box"/><rect x="585" y="745" width="280" height="42" rx="7" class="head"/><text x="725" y="772" text-anchor="middle" class="t h">Huésped</text>
<text x="607" y="815" class="t f">PK id_huesped</text><text x="607" y="843" class="t f">nombre *</text><text x="607" y="871" class="t f">otros_datos *</text>

<rect x="365" y="365" width="320" height="280" rx="7" class="box"/><rect x="365" y="365" width="320" height="42" rx="7" class="head"/><text x="525" y="392" text-anchor="middle" class="t h">Reserva</text>
<text x="387" y="435" class="t f">PK id_reserva</text><text x="387" y="463" class="t f">FK id_huesped</text><text x="387" y="491" class="t f">FK id_habitacion</text><text x="387" y="519" class="t f">FK id_usuario</text><text x="387" y="547" class="t f">fecha_entrada *</text><text x="387" y="575" class="t f">fecha_salida *</text><text x="387" y="603" class="t f">estado *</text>

<rect x="785" y="365" width="330" height="305" rx="7" class="box"/><rect x="785" y="365" width="330" height="42" rx="7" class="head"/><text x="950" y="392" text-anchor="middle" class="t h">Estadía</text>
<text x="807" y="435" class="t f">PK id_estadia</text><text x="807" y="463" class="t f">FK id_huesped</text><text x="807" y="491" class="t f">FK id_habitacion</text><text x="807" y="519" class="t f">FK id_usuario</text><text x="807" y="547" class="t f">checkin</text><text x="807" y="575" class="t f">checkout</text><text x="807" y="603" class="t f">cantidad_pasajeros *</text><text x="807" y="631" class="t f">costo_total *</text>

<!-- relaciones -->
<line x1="650" y1="290" x2="565" y2="365" class="rel"/><rect x="573" y="315" width="64" height="25" rx="4" class="lbl"/><text x="605" y="333" text-anchor="middle" class="t f">1 : N</text>
