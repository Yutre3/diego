<line x1="340" y1="440" x2="365" y2="440" class="rel"/><rect x="313" y="405" width="64" height="25" rx="4" class="lbl"/><text x="345" y="423" text-anchor="middle" class="t f">1 : N</text>
<path d="M210 550 V700 H950 V670" class="rel"/><rect x="535" y="687" width="64" height="25" rx="4" class="lbl"/><text x="567" y="705" text-anchor="middle" class="t f">1 : N</text>

<line x1="650" y1="745" x2="565" y2="645" class="rel"/><rect x="573" y="684" width="64" height="25" rx="4" class="lbl"/><text x="605" y="702" text-anchor="middle" class="t f">1 : N</text>
