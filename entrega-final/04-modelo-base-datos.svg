<rect x="260" y="560" width="380" height="300" rx="9" class="box"/><rect x="260" y="560" width="380" height="46" rx="9" class="head"/><text x="450" y="590" text-anchor="middle" class="t h">Reserva</text><text x="290" y="642" class="t f">PK  id_reserva</text><text x="290" y="674" class="t f">FK  id_huesped</text><text x="290" y="706" class="t f">FK  id_habitacion</text><text x="290" y="738" class="t f">fecha_entrada *</text><text x="290" y="770" class="t f">fecha_salida *</text><text x="290" y="802" class="t f">cantidad_pasajeros *</text><text x="290" y="834" class="t f">estado *</text>
