<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#26343d}.title{font-size:30px;font-weight:700}.h{font-size:18px;font-weight:700}.f{font-size:14px}.small{font-size:13px}
.box{fill:#fff;stroke:#4f626c;stroke-width:2}.head{fill:#edf2f4;stroke:#4f626c;stroke-width:2}.rel{stroke:#536a74;stroke-width:2.2;fill:none}.badge{fill:#fff;stroke:#d9e2e6;stroke-width:1}
</style></defs>
<rect width="1500" height="900" fill="#fff"/>
<text x="750" y="48" text-anchor="middle" class="t title">Modelo de base de datos</text>

<!-- Reserva al centro -->
<rect x="550" y="275" width="400" height="285" rx="9" class="box"/>
<rect x="550" y="275" width="400" height="46" rx="9" class="head"/>
<text x="750" y="305" text-anchor="middle" class="t h">Reserva</text>
<text x="580" y="360" class="t f">PK  id_reserva</text>
<text x="580" y="393" class="t f">FK  id_huesped</text>
<text x="580" y="426" class="t f">FK  id_habitacion</text>
<text x="580" y="459" class="t f">fecha_entrada</text>
<text x="580" y="492" class="t f">fecha_salida</text>
<text x="580" y="525" class="t f">estado</text>

<!-- Huésped a la izquierda -->
<rect x="90" y="310" width="300" height="185" rx="9" class="box"/>
<rect x="90" y="310" width="300" height="46" rx="9" class="head"/>
<text x="240" y="340" text-anchor="middle" class="t h">Huésped</text>
<text x="120" y="395" class="t f">PK  id_huesped</text>
<text x="120" y="429" class="t f">nombre</text>
<text x="120" y="463" class="t f">otros_datos</text>

<!-- Habitación a la derecha -->
<rect x="1110" y="292" width="300" height="220" rx="9" class="box"/>
<rect x="1110" y="292" width="300" height="46" rx="9" class="head"/>
<text x="1260" y="322" text-anchor="middle" class="t h">Habitación</text>
<text x="1140" y="377" class="t f">PK  id_habitacion</text>
<text x="1140" y="411" class="t f">capacidad</text>
<text x="1140" y="445" class="t f">orientacion</text>
<text x="1140" y="479" class="t f">estado</text>

<!-- Estadía debajo -->
<rect x="550" y="640" width="400" height="220" rx="9" class="box"/>
<rect x="550" y="640" width="400" height="46" rx="9" class="head"/>
<text x="750" y="670" text-anchor="middle" class="t h">Estadía</text>
<text x="580" y="725" class="t f">PK  id_estadia</text>
<text x="580" y="758" class="t f">FK  id_reserva</text>
<text x="580" y="791" class="t f">checkin</text>
<text x="580" y="824" class="t f">checkout</text>
<text x="780" y="791" class="t f">cantidad_pasajeros</text>
<text x="780" y="824" class="t f">costo_total</text>

<!-- Usuario arriba, sin forzar relación no definida -->
<rect x="550" y="80" width="400" height="145" rx="9" class="box"/>
<rect x="550" y="80" width="400" height="46" rx="9" class="head"/>
<text x="750" y="110" text-anchor="middle" class="t h">Usuario</text>
<text x="580" y="165" class="t f">PK  id_usuario</text>
<text x="730" y="165" class="t f">nombre</text>
<text x="850" y="165" class="t f">rol</text>

<!-- Relaciones rectas -->
<line x1="390" y1="402" x2="550" y2="402" class="rel"/>
<rect x="445" y="368" width="70" height="27" rx="5" class="badge"/>
<text x="480" y="387" text-anchor="middle" class="t small">1 : N</text>

<line x1="950" y1="402" x2="1110" y2="402" class="rel"/>
<rect x="985" y="368" width="70" height="27" rx="5" class="badge"/>
<text x="1020" y="387" text-anchor="middle" class="t small">N : 1</text>

<line x1="750" y1="560" x2="750" y2="640" class="rel"/>
<rect x="705" y="586" width="90" height="27" rx="5" class="badge"/>
<text x="750" y="605" text-anchor="middle" class="t small">1 : 0..1</text>
</svg>