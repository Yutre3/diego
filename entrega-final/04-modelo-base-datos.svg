<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#26343d}.title{font-size:30px;font-weight:700}.h{font-size:18px;font-weight:700}.f{font-size:14px}.small{font-size:13px}
.box{fill:#fff;stroke:#4f626c;stroke-width:2.1}.head{fill:#edf2f4;stroke:#4f626c;stroke-width:2.1}.rel{stroke:#536a74;stroke-width:2.2;fill:none}.badge{fill:#fff;stroke:#d9e2e6;stroke-width:1}
</style></defs>
<rect width="1500" height="900" fill="#fff"/>
<text x="750" y="48" text-anchor="middle" class="t title">Modelo de base de datos</text>

<!-- Huésped -->
<rect x="80" y="150" width="300" height="185" rx="9" class="box"/>
<rect x="80" y="150" width="300" height="46" rx="9" class="head"/>
<text x="230" y="180" text-anchor="middle" class="t h">Huésped</text>
<text x="110" y="235" class="t f">PK  id_huesped</text>
<text x="110" y="269" class="t f">nombre</text>
<text x="110" y="303" class="t f">otros_datos</text>

<!-- Habitación -->
<rect x="600" y="135" width="300" height="220" rx="9" class="box"/>
<rect x="600" y="135" width="300" height="46" rx="9" class="head"/>
<text x="750" y="165" text-anchor="middle" class="t h">Habitación</text>
<text x="630" y="220" class="t f">PK  id_habitacion</text>
<text x="630" y="254" class="t f">capacidad</text>
<text x="630" y="288" class="t f">orientacion</text>
<text x="630" y="322" class="t f">estado</text>

<!-- Usuario -->
<rect x="1120" y="150" width="300" height="185" rx="9" class="box"/>
<rect x="1120" y="150" width="300" height="46" rx="9" class="head"/>
<text x="1270" y="180" text-anchor="middle" class="t h">Usuario</text>
<text x="1150" y="235" class="t f">PK  id_usuario</text>
<text x="1150" y="269" class="t f">nombre</text>
<text x="1150" y="303" class="t f">rol</text>

<!-- Reserva -->
<rect x="260" y="540" width="400" height="285" rx="9" class="box"/>
<rect x="260" y="540" width="400" height="46" rx="9" class="head"/>
<text x="460" y="570" text-anchor="middle" class="t h">Reserva</text>
<text x="290" y="625" class="t f">PK  id_reserva</text>
<text x="290" y="658" class="t f">FK  id_huesped</text>
<text x="290" y="691" class="t f">FK  id_habitacion</text>
<text x="290" y="724" class="t f">fecha_entrada</text>
<text x="290" y="757" class="t f">fecha_salida</text>
<text x="290" y="790" class="t f">estado</text>

<!-- Estadía -->
<rect x="840" y="540" width="400" height="285" rx="9" class="box"/>
<rect x="840" y="540" width="400" height="46" rx="9" class="head"/>
<text x="1040" y="570" text-anchor="middle" class="t h">Estadía</text>
<text x="870" y="625" class="t f">PK  id_estadia</text>
<text x="870" y="658" class="t f">FK  id_reserva</text>
<text x="870" y="691" class="t f">checkin</text>
<text x="870" y="724" class="t f">checkout</text>
<text x="870" y="757" class="t f">cantidad_pasajeros</text>
<text x="870" y="790" class="t f">costo_total</text>

<!-- Relaciones limpias -->
<path d="M230 335 V435 H400 V540" class="rel"/>
<rect x="265" y="410" width="72" height="27" rx="5" class="badge"/><text x="301" y="429" text-anchor="middle" class="t small">1 : N</text>

<path d="M750 355 V455 H520 V540" class="rel"/>
<rect x="650" y="440" width="72" height="27" rx="5" class="badge"/><text x="686" y="459" text-anchor="middle" class="t small">1 : N</text>

<path d="M660 685 H840" class="rel"/>
<rect x="705" y="650" width="90" height="27" rx="5" class="badge"/><text x="750" y="669" text-anchor="middle" class="t small">1 : 0..1</text>
</svg>