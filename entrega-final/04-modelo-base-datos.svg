<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<defs>
<style>
.t{font-family:Arial,sans-serif;fill:#25343c}.title{font-size:31px;font-weight:700}.sub{font-size:15px;fill:#6d7b83}.h{font-size:18px;font-weight:700}.f{font-size:14px}.small{font-size:13px}
.box{fill:#fff;stroke:#4f626c;stroke-width:2.1}.head{fill:#eef3f5;stroke:#4f626c;stroke-width:2.1}.rel{stroke:#536a74;stroke-width:2.2;fill:none}.badge{fill:#fff;stroke:#d9e2e6}.note{fill:#f8fafb;stroke:#dde5e9}
</style>
</defs>
<rect width="1500" height="980" fill="#fff"/>
<text x="750" y="44" text-anchor="middle" class="t title">Modelo de base de datos</text>
<text x="750" y="72" text-anchor="middle" class="t sub">Entidades necesarias para reservas, estadías y gestión de usuarios</text>

<!-- Huesped -->
<rect x="100" y="145" width="290" height="190" rx="9" class="box"/>
<rect x="100" y="145" width="290" height="46" rx="9" class="head"/>
<text x="245" y="175" text-anchor="middle" class="t h">Huésped</text>
<text x="130" y="228" class="t f">PK  id_huesped</text>
<text x="130" y="260" class="t f">nombre</text>
<text x="130" y="292" class="t f">otros_datos *</text>

<!-- Habitacion -->
<rect x="605" y="130" width="290" height="220" rx="9" class="box"/>
<rect x="605" y="130" width="290" height="46" rx="9" class="head"/>
<text x="750" y="160" text-anchor="middle" class="t h">Habitación</text>
<text x="635" y="213" class="t f">PK  id_habitacion</text>
<text x="635" y="245" class="t f">capacidad</text>
<text x="635" y="277" class="t f">orientacion</text>
<text x="635" y="309" class="t f">estado *</text>

<!-- Usuario -->
<rect x="1110" y="145" width="290" height="190" rx="9" class="box"/>
<rect x="1110" y="145" width="290" height="46" rx="9" class="head"/>
<text x="1255" y="175" text-anchor="middle" class="t h">Usuario</text>
<text x="1140" y="228" class="t f">PK  id_usuario</text>
<text x="1140" y="260" class="t f">nombre</text>
<text x="1140" y="292" class="t f">rol</text>

<!-- Reserva -->
<rect x="280" y="560" width="360" height="300" rx="9" class="box"/>
<rect x="280" y="560" width="360" height="46" rx="9" class="head"/>
<text x="460" y="590" text-anchor="middle" class="t h">Reserva</text>
<text x="310" y="642" class="t f">PK  id_reserva</text>
<text x="310" y="674" class="t f">FK  id_huesped</text>
<text x="310" y="706" class="t f">FK  id_habitacion</text>
<text x="310" y="738" class="t f">fecha_entrada *</text>
<text x="310" y="770" class="t f">fecha_salida *</text>
<text x="310" y="802" class="t f">cantidad_pasajeros *</text>
<text x="310" y="834" class="t f">estado *</text>

<!-- Estadia -->
<rect x="850" y="580" width="360" height="250" rx="9" class="box"/>
<rect x="850" y="580" width="360" height="46" rx="9" class="head"/>
<text x="1030" y="610" text-anchor="middle" class="t h">Estadía</text>
<text x="880" y="662" class="t f">PK  id_estadia</text>
<text x="880" y="694" class="t f">FK  id_reserva</text>
<text x="880" y="726" class="t f">checkin</text>
<text x="880" y="758" class="t f">checkout</text>
<text x="880" y="790" class="t f">costo_total *</text>

<!-- Relaciones principales -->
<path d="M245 335 V455 H420 V560" class="rel"/>
<rect x="270" y="430" width="72" height="27" rx="5" class="badge"/><text x="306" y="449" text-anchor="middle" class="t small">1 : N</text>

<path d="M750 350 V470 H500 V560" class="rel"/>
<rect x="646" y="455" width="72" height="27" rx="5" class="badge"/><text x="682" y="474" text-anchor="middle" class="t small">1 : N</text>

<path d="M640 710 H850" class="rel"/>
<rect x="700" y="675" width="92" height="27" rx="5" class="badge"/><text x="746" y="694" text-anchor="middle" class="t small">1 : 0..1</text>

<!-- Usuario separado, porque el caso no define FK exacta -->
<rect x="1040" y="405" width="430" height="82" rx="9" class="note"/>
<text x="1255" y="434" text-anchor="middle" class="t small">Usuario representa los perfiles Administrador</text>
<text x="1255" y="458" text-anchor="middle" class="t small">y Encargado. El Caso 6 no define una relación FK exacta.</text>

<rect x="100" y="900" width="1300" height="50" rx="9" class="note"/>
<text x="125" y="931" class="t small">* Campos de diseño usados para el prototipo cuando el Caso 6 no define su detalle exacto.</text>
</svg>