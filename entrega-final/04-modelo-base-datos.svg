<rect x="1040" y="395" width="440" height="86" rx="9" class="note"/><text x="1260" y="425" text-anchor="middle" class="t small">Usuario almacena los perfiles Administrador y Encargado.</text><text x="1260" y="450" text-anchor="middle" class="t small">No se agrega una FK a Reserva/Estadía porque el Caso 6</text><text x="1260" y="473" text-anchor="middle" class="t small">no indica qué operaciones deben guardar al usuario responsable.</text>
