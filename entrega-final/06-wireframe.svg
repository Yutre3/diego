<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#252c30}.title{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.f{font-size:14px}
.frame{fill:#fff;stroke:#5d686e;stroke-width:2}.light{fill:#f0f0f0;stroke:#777;stroke-width:1.5}.mid{fill:#d8d8d8;stroke:#707070;stroke-width:1.5}
</style></defs>
<rect width="1400" height="900" fill="#fff"/>
<text x="700" y="42" text-anchor="middle" class="t title">Wireframe - Pantalla de reservas</text>

<rect x="70" y="75" width="1260" height="760" class="frame"/>
<rect x="95" y="100" width="1210" height="78" class="mid"/>
<text x="125" y="145" class="t h">Hotel Duerme Bien</text>
<text x="1110" y="145" class="t f">usuario / acción</text>

<rect x="95" y="205" width="225" height="590" class="light"/>
<text x="125" y="242" class="t h">Menú</text>
<text x="125" y="285" class="t f">Inicio</text>
<text x="125" y="325" class="t f">Habitaciones</text>
<text x="125" y="365" class="t f">Huéspedes</text>
<rect x="115" y="382" width="185" height="36" class="mid"/><text x="125" y="405" class="t f">Reservas</text>
<text x="125" y="445" class="t f">Check-in</text>
<text x="125" y="485" class="t f">Check-out</text>
<text x="125" y="525" class="t f">Usuarios</text>
<text x="125" y="565" class="t f">Informes</text>

<text x="365" y="242" class="t h">Panel de reservas</text>
<text x="365" y="264" class="t f">Consulta disponibilidad y registra una nueva reserva</text>

<rect x="360" y="285" width="920" height="115" class="frame"/>
<text x="390" y="318" class="t h">Buscar disponibilidad</text>
<text x="390" y="350" class="t f">Entrada</text><rect x="445" y="330" width="190" height="42" class="light"/>
<text x="670" y="350" class="t f">Salida</text><rect x="715" y="330" width="190" height="42" class="light"/>
<rect x="1070" y="327" width="160" height="46" class="mid"/><text x="1150" y="356" text-anchor="middle" class="t f">Consultar</text>

<rect x="360" y="435" width="570" height="305" class="frame"/>
<text x="390" y="470" class="t h">Habitaciones disponibles</text>
<rect x="390" y="500" width="510" height="72" class="light"/>
<text x="410" y="530" class="t h">Habitación 201</text><text x="410" y="553" class="t f">Capacidad 2 · Norte</text><text x="795" y="541" class="t f">Seleccionar</text>
<rect x="390" y="595" width="510" height="72" class="light"/>
<text x="410" y="625" class="t h">Habitación 305</text><text x="410" y="648" class="t f">Capacidad 3 · Sur</text><text x="795" y="636" class="t f">Seleccionar</text>

<rect x="960" y="435" width="320" height="305" class="frame"/>
<text x="990" y="470" class="t h">Nueva reserva</text>
<text x="990" y="500" class="t f">Huésped</text><rect x="990" y="510" width="260" height="38" class="light"/>
<text x="990" y="575" class="t f">Habitación</text><rect x="990" y="585" width="260" height="38" class="light"/>
<text x="990" y="650" class="t f">Fechas / cantidad</text><rect x="990" y="660" width="260" height="38" class="light"/>
<rect x="990" y="710" width="260" height="42" class="mid"/><text x="1120" y="737" text-anchor="middle" class="t f">Guardar reserva</text>

<text x="70" y="875" class="t f">Wireframe: estructura y jerarquía visual, sin estilos definitivos.</text>
</svg>