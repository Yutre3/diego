<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#32383c}.title{font-size:31px;font-weight:700}.sub{font-size:15px;fill:#666666}.h{font-size:18px;font-weight:700}.f{font-size:14px}.small{font-size:12px}
.box{fill:#ffffff;stroke:#777777;stroke-width:2}.field{fill:#f1f1f1;stroke:#777777;stroke-width:1.6}.thin{stroke:#777777;stroke-width:2;fill:none}.navtext{font-size:14px;fill:#32383c}.btntext{font-size:13px;fill:#32383c;font-weight:700}
</style></defs>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="800" y="44" text-anchor="middle" class="t title">Wireframe · Hotel Duerme Bien</text>
<text x="800" y="72" text-anchor="middle" class="t sub">Estructura y jerarquía de la pantalla de reservas</text>

<!-- marco -->
<rect x="70" y="105" width="1460" height="825" rx="14" fill="#ffffff" stroke="#777777" stroke-width="2"/>

<!-- top bar -->
<rect x="95" y="130" width="1410" height="86" rx="10" fill="#d7d7d7" stroke="#777777" stroke-width="2"/>
<rect x="125" y="148" width="48" height="48" rx="12" fill="#ffffff" stroke="#777777" stroke-width="2"/>
<text x="149" y="178" text-anchor="middle" class="t f" fill="#32383c" font-weight="700">DB</text>
<text x="195" y="165" class="t h" fill="#32383c">Hotel Duerme Bien</text>
<text x="195" y="188" class="t small" fill="#666666">Sistema de Pasajeros · Prototipo funcional</text>
<rect x="1245" y="151" width="220" height="42" rx="9" fill="#eeeeee" stroke="#777777" stroke-width="1.4"/>
<text x="1355" y="177" text-anchor="middle" class="t small" fill="#32383c">acción superior</text>

<!-- sidebar -->
<rect x="95" y="238" width="250" height="667" rx="10" fill="#ececec" stroke="#777777" stroke-width="2"/>
<text x="125" y="278" class="t small" fill="#32383c" font-weight="700">GESTIÓN HOTELERA</text>
<rect x="115" y="315" width="210" height="42" rx="9" fill="transparent" stroke="none"/>
  <text x="138" y="341" class="t navtext" fill="#32383c" font-weight="400">Inicio</text><rect x="115" y="370" width="210" height="42" rx="9" fill="transparent" stroke="none"/>
  <text x="138" y="396" class="t navtext" fill="#32383c" font-weight="400">Habitaciones</text><rect x="115" y="425" width="210" height="42" rx="9" fill="transparent" stroke="none"/>
  <text x="138" y="451" class="t navtext" fill="#32383c" font-weight="400">Huéspedes</text><rect x="115" y="480" width="210" height="42" rx="9" fill="#cfcfcf" stroke="#777777"/>
  <text x="138" y="506" class="t navtext" fill="#32383c" font-weight="700">Reservas</text><rect x="115" y="535" width="210" height="42" rx="9" fill="transparent" stroke="none"/>
  <text x="138" y="561" class="t navtext" fill="#32383c" font-weight="400">Check-in</text><rect x="115" y="590" width="210" height="42" rx="9" fill="transparent" stroke="none"/>
  <text x="138" y="616" class="t navtext" fill="#32383c" font-weight="400">Check-out</text><rect x="115" y="645" width="210" height="42" rx="9" fill="transparent" stroke="none"/>
  <text x="138" y="671" class="t navtext" fill="#32383c" font-weight="400">Usuarios</text><rect x="115" y="700" width="210" height="42" rx="9" fill="transparent" stroke="none"/>
  <text x="138" y="726" class="t navtext" fill="#32383c" font-weight="400">Informes</text>

<!-- content header -->
<text x="395" y="278" class="t small" fill="#666666" font-weight="700">RESERVAS</text>
<text x="395" y="315" class="t title" style="font-size:27px">Panel de reservas</text>
<text x="395" y="342" class="t sub">Consulta disponibilidad, selecciona una habitación y registra la reserva.</text>

<!-- flow steps -->
<rect x="395" y="370" width="1080" height="80" rx="12" class="box"/>
<circle cx="430" cy="410" r="19" fill="#ffffff" stroke="#777777" stroke-width="1.5"/>
  <text x="430" y="415" text-anchor="middle" class="t small" font-weight="700">1</text>
  <text x="464" y="404" class="t f" font-weight="700">Consultar</text>
  <text x="464" y="425" class="t small" fill="#666666">Definir fechas</text>
  <line x1="605" y1="410" x2="745" y2="410" class="thin"/><circle cx="780" cy="410" r="19" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="780" y="415" text-anchor="middle" class="t small" font-weight="700">2</text>
  <text x="814" y="404" class="t f" font-weight="700">Seleccionar</text>
  <text x="814" y="425" class="t small" fill="#666666">Elegir habitación</text>
  <line x1="955" y1="410" x2="1095" y2="410" class="thin"/><circle cx="1130" cy="410" r="19" fill="#f1f1f1" stroke="#777777" stroke-width="1.5"/>
  <text x="1130" y="415" text-anchor="middle" class="t small" font-weight="700">3</text>
  <text x="1164" y="404" class="t f" font-weight="700">Guardar</text>
  <text x="1164" y="425" class="t small" fill="#666666">Registrar reserva</text>
  

<!-- search card -->
<rect x="395" y="475" width="1080" height="150" rx="14" class="box"/>
<text x="425" y="512" class="t small" fill="#666666" font-weight="700">PASO 1</text>
<text x="425" y="540" class="t h">Buscar disponibilidad</text>
<text x="425" y="575" class="t small" fill="#666666">Fecha de entrada</text>
<rect x="425" y="585" width="260" height="42" rx="9" class="field"/>
<text x="720" y="575" class="t small" fill="#666666">Fecha de salida</text>
<rect x="720" y="585" width="260" height="42" rx="9" class="field"/>
<rect x="1185" y="581" width="245" height="46" rx="9" fill="#cfcfcf" stroke="#777777" stroke-width="1.6"/>
<text x="1308" y="610" text-anchor="middle" class="t btntext">Consultar disponibilidad</text>

<!-- left card -->
<rect x="395" y="655" width="650" height="220" rx="14" class="box"/>
<text x="425" y="693" class="t small" fill="#666666" font-weight="700">PASO 2</text>
<text x="425" y="720" class="t h">Habitaciones disponibles</text>
<rect x="425" y="744" width="590" height="58" rx="9" class="field"/>
<text x="445" y="770" class="t f" font-weight="700">Habitación 201</text>
<text x="445" y="790" class="t small" fill="#666666">Capacidad 2 · Orientación Norte</text>
<rect x="860" y="753" width="130" height="38" rx="8" fill="#cfcfcf" stroke="#777777" stroke-width="1.5"/>
<text x="925" y="777" text-anchor="middle" class="t btntext">Seleccionar</text>
<rect x="425" y="814" width="590" height="42" rx="9" class="field"/>
<text x="445" y="840" class="t f">Habitación 305 · Capacidad 3 · Este</text>

<!-- right form -->
<rect x="1075" y="655" width="400" height="220" rx="14" class="box"/>
<text x="1105" y="693" class="t small" fill="#666666" font-weight="700">PASO 3</text>
<text x="1105" y="720" class="t h">Nueva reserva</text>
<rect x="1105" y="744" width="340" height="34" rx="7" class="field"/>
<rect x="1105" y="790" width="160" height="34" rx="7" class="field"/>
<rect x="1285" y="790" width="160" height="34" rx="7" class="field"/>
<rect x="1105" y="836" width="340" height="38" rx="8" fill="#cfcfcf" stroke="#777777" stroke-width="1.5"/>
<text x="1275" y="861" text-anchor="middle" class="t btntext">Guardar reserva</text>

<text x="95" y="965" class="t small" fill="#666666">Wireframe: estructura y jerarquía en escala de grises, sin diseño visual final.</text>
</svg>