<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#222"/>
  </marker>
  <style>
    .t{font-family:Arial,sans-serif;fill:#222}.title{font-size:28px;font-weight:700}.label{font-size:22px}.small{font-size:18px}
    .line{stroke:#222;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .term{fill:#fff;stroke:#d86565;stroke-width:3}.proc{fill:#fff;stroke:#2e9c98;stroke-width:3}.io{fill:#fff;stroke:#2e9c98;stroke-width:3}.dec{fill:#fff;stroke:#555;stroke-width:3}
    .tag{fill:white;stroke:#ddd;stroke-width:1}
  </style>
</defs>
<rect width="1000" height="1180" fill="white"/>
<text x="500" y="38" text-anchor="middle" class="t title">Flujo de check-in y asignación de habitación</text>

<rect x="380" y="70" width="240" height="70" rx="35" class="term"/>
<text x="500" y="114" text-anchor="middle" class="t label">Inicio</text>
<line x1="500" y1="140" x2="500" y2="200" class="line"/>

<polygon points="360,200 650,200 620,290 330,290" class="io"/>
<text x="490" y="243" text-anchor="middle" class="t label">Ingresar datos</text>
<text x="490" y="270" text-anchor="middle" class="t label">del huésped</text>
<line x1="500" y1="290" x2="500" y2="350" class="line"/>

<polygon points="500,350 660,425 500,500 340,425" class="dec"/>
<text x="500" y="419" text-anchor="middle" class="t label">¿Datos completos?</text>

<!-- No loop -->
<path d="M660 425 L820 425 L820 245 L650 245" class="line"/>
<rect x="685" y="389" width="52" height="28" rx="5" class="tag"/>
<text x="711" y="409" text-anchor="middle" class="t small">No</text>

<!-- Yes -->
<line x1="500" y1="500" x2="500" y2="565" class="line"/>
<rect x="515" y="518" width="42" height="28" rx="5" class="tag"/>
<text x="536" y="538" text-anchor="middle" class="t small">Sí</text>

<rect x="350" y="565" width="300" height="78" rx="8" class="proc"/>
<text x="500" y="599" text-anchor="middle" class="t label">Consultar habitación</text>
<text x="500" y="627" text-anchor="middle" class="t label">disponible</text>
<line x1="500" y1="643" x2="500" y2="705" class="line"/>

<polygon points="500,705 670,785 500,865 330,785" class="dec"/>
<text x="500" y="779" text-anchor="middle" class="t label">¿Hay habitación</text>
<text x="500" y="808" text-anchor="middle" class="t label">disponible?</text>

<!-- No branch to right -->
<line x1="670" y1="785" x2="760" y2="785" class="line"/>
<rect x="686" y="748" width="52" height="28" rx="5" class="tag"/>
<text x="712" y="768" text-anchor="middle" class="t small">No</text>
<rect x="760" y="740" width="210" height="90" rx="8" class="proc"/>
<text x="865" y="777" text-anchor="middle" class="t small">Informar que no hay</text>
<text x="865" y="804" text-anchor="middle" class="t small">disponibilidad</text>
<line x1="865" y1="830" x2="865" y2="930" class="line"/>
<rect x="765" y="930" width="200" height="65" rx="32" class="term"/>
<text x="865" y="971" text-anchor="middle" class="t label">Fin</text>

<!-- Yes branch down -->
<line x1="500" y1="865" x2="500" y2="925" class="line"/>
<rect x="515" y="883" width="42" height="28" rx="5" class="tag"/>
<text x="536" y="903" text-anchor="middle" class="t small">Sí</text>

<rect x="360" y="925" width="280" height="72" rx="8" class="proc"/>
<text x="500" y="969" text-anchor="middle" class="t label">Asignar habitación</text>
<line x1="500" y1="997" x2="500" y2="1040" class="line"/>

<rect x="330" y="1040" width="340" height="78" rx="8" class="proc"/>
<text x="500" y="1073" text-anchor="middle" class="t small">Registrar check-in y ocupación</text>
<text x="500" y="1098" text-anchor="middle" class="t small">en la base de datos</text>
<line x1="500" y1="1118" x2="500" y2="1140" class="line"/>

<rect x="410" y="1140" width="180" height="34" rx="17" class="term"/>
<text x="500" y="1164" text-anchor="middle" class="t small">Fin</text>
</svg>