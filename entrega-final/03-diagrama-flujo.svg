<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100">
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#26343c"/></marker>
<style>
.t{font-family:Arial,sans-serif;fill:#24343d}.title{font-size:28px;font-weight:700}.label{font-size:20px}.small{font-size:16px}
.line{stroke:#26343c;stroke-width:2.8;fill:none;marker-end:url(#arrow)}.term{fill:#fff;stroke:#c96060;stroke-width:2.5}.proc{fill:#fff;stroke:#2b8798;stroke-width:2.5}.io{fill:#fff;stroke:#2b8798;stroke-width:2.5}.dec{fill:#fff;stroke:#64727a;stroke-width:2.5}
</style>
</defs>
<rect width="1100" height="1100" fill="#fff"/>
<text x="550" y="40" text-anchor="middle" class="t title">Diagrama de flujo - Check-in</text>

<rect x="430" y="70" width="240" height="64" rx="32" class="term"/>
<text x="550" y="110" text-anchor="middle" class="t label">Inicio</text>
<line x1="550" y1="134" x2="550" y2="185" class="line"/>

<polygon points="410,185 700,185 670,270 380,270" class="io"/>
<text x="540" y="225" text-anchor="middle" class="t label">Ingresar datos</text>
<text x="540" y="250" text-anchor="middle" class="t label">del huésped</text>
<line x1="550" y1="270" x2="550" y2="325" class="line"/>

<polygon points="550,325 700,395 550,465 400,395" class="dec"/>
<text x="550" y="402" text-anchor="middle" class="t label">¿Datos completos?</text>

<!-- NO: retorna por la derecha -->
<path d="M700 395 H845 V225 H700" class="line"/>
<text x="730" y="378" class="t small">No</text>

<!-- SI: sigue hacia abajo -->
<line x1="550" y1="465" x2="550" y2="525" class="line"/>
<text x="570" y="495" class="t small">Sí</text>

<rect x="390" y="525" width="320" height="78" rx="8" class="proc"/>
<text x="550" y="558" text-anchor="middle" class="t label">Consultar habitación</text>
<text x="550" y="584" text-anchor="middle" class="t label">disponible</text>
<line x1="550" y1="603" x2="550" y2="655" class="line"/>

<polygon points="550,655 710,730 550,805 390,730" class="dec"/>
<text x="550" y="724" text-anchor="middle" class="t label">¿Hay habitación</text>
<text x="550" y="750" text-anchor="middle" class="t label">disponible?</text>

<!-- NO: rama derecha -->
<line x1="710" y1="730" x2="805" y2="730" class="line"/>
<text x="735" y="713" class="t small">No</text>
<rect x="805" y="690" width="245" height="80" rx="8" class="proc"/>
<text x="928" y="724" text-anchor="middle" class="t small">Informar que no hay</text>
<text x="928" y="748" text-anchor="middle" class="t small">disponibilidad</text>
<line x1="928" y1="770" x2="928" y2="845" class="line"/>
<rect x="838" y="845" width="180" height="58" rx="29" class="term"/>
<text x="928" y="881" text-anchor="middle" class="t label">Fin</text>

<!-- SI: rama principal -->
<line x1="550" y1="805" x2="550" y2="850" class="line"/>
<text x="570" y="830" class="t small">Sí</text>
<rect x="410" y="850" width="280" height="68" rx="8" class="proc"/>
<text x="550" y="892" text-anchor="middle" class="t label">Asignar habitación</text>
<line x1="550" y1="918" x2="550" y2="955" class="line"/>

<rect x="370" y="955" width="360" height="72" rx="8" class="proc"/>
<text x="550" y="985" text-anchor="middle" class="t small">Registrar check-in y ocupación</text>
<text x="550" y="1008" text-anchor="middle" class="t small">en el sistema</text>
<line x1="550" y1="1027" x2="550" y2="1050" class="line"/>
<rect x="465" y="1040" width="170" height="48" rx="24" class="term"/>
<text x="550" y="1071" text-anchor="middle" class="t small">Fin</text>
</svg>