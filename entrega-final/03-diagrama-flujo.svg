<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1160" viewBox="0 0 1250 1160">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#33454f"/></marker>
<style>
.t{font-family:Arial,sans-serif;fill:#26343d}.title{font-size:30px;font-weight:700}.label{font-size:18px}.small{font-size:14px}
.line{stroke:#33454f;stroke-width:2.6;fill:none;marker-end:url(#arrow)}
.term{fill:#fff;stroke:#9b5e5e;stroke-width:2.3}.proc{fill:#fff;stroke:#2e747b;stroke-width:2.3}.dec{fill:#fff;stroke:#63747d;stroke-width:2.3}
</style></defs>
<rect width="1250" height="1160" fill="#fff"/>
<text x="625" y="48" text-anchor="middle" class="t title">Diagrama de flujo · Check-in</text>

<rect x="500" y="90" width="250" height="62" rx="31" class="term"/><text x="625" y="129" text-anchor="middle" class="t label">Inicio</text>
<line x1="625" y1="152" x2="625" y2="205" class="line"/>

<rect x="445" y="205" width="360" height="78" rx="10" class="proc"/>
<text x="625" y="238" text-anchor="middle" class="t label">Registrar o seleccionar huésped</text>
<text x="625" y="263" text-anchor="middle" class="t small">para iniciar el ingreso</text>
<line x1="625" y1="283" x2="625" y2="335" class="line"/>

<rect x="455" y="335" width="340" height="78" rx="10" class="proc"/>
<text x="625" y="369" text-anchor="middle" class="t label">Consultar disponibilidad</text>
<text x="625" y="394" text-anchor="middle" class="t small">de habitaciones</text>
<line x1="625" y1="413" x2="625" y2="465" class="line"/>

<polygon points="625,465 805,545 625,625 445,545" class="dec"/>
<text x="625" y="539" text-anchor="middle" class="t label">¿Hay habitación</text>
<text x="625" y="564" text-anchor="middle" class="t label">disponible?</text>

<!-- No -->
<line x1="805" y1="545" x2="900" y2="545" class="line"/>
<text x="835" y="525" class="t small">No</text>
<rect x="900" y="505" width="280" height="80" rx="10" class="proc"/>
<text x="1040" y="538" text-anchor="middle" class="t small">Informar que no hay</text>
<text x="1040" y="562" text-anchor="middle" class="t small">disponibilidad</text>
<line x1="1040" y1="585" x2="1040" y2="665" class="line"/>
<rect x="955" y="665" width="170" height="56" rx="28" class="term"/><text x="1040" y="701" text-anchor="middle" class="t label">Fin</text>

<!-- Sí -->
<line x1="625" y1="625" x2="625" y2="690" class="line"/>
<text x="648" y="660" class="t small">Sí</text>

<rect x="470" y="690" width="310" height="72" rx="10" class="proc"/>
<text x="625" y="735" text-anchor="middle" class="t label">Asignar habitación</text>
<line x1="625" y1="762" x2="625" y2="820" class="line"/>

<rect x="455" y="820" width="340" height="74" rx="10" class="proc"/>
<text x="625" y="865" text-anchor="middle" class="t label">Registrar check-in</text>
<line x1="625" y1="894" x2="625" y2="950" class="line"/>

<rect x="435" y="950" width="380" height="76" rx="10" class="proc"/>
<text x="625" y="982" text-anchor="middle" class="t label">Actualizar ocupación</text>
<text x="625" y="1008" text-anchor="middle" class="t small">habitación = OCUPADA</text>
<line x1="625" y1="1026" x2="625" y2="1065" class="line"/>

<rect x="540" y="1060" width="170" height="56" rx="28" class="term"/><text x="625" y="1096" text-anchor="middle" class="t label">Fin</text>
</svg>