<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1280" viewBox="0 0 1300 1280">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#33454f"/></marker>
  <style>
    .t{font-family:Arial,sans-serif;fill:#26343d}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#6e7c84}.label{font-size:19px}.small{font-size:15px}
    .line{stroke:#33454f;stroke-width:2.7;fill:none;marker-end:url(#arrow)}.term{fill:#fff;stroke:#a75e5e;stroke-width:2.5}
    .proc{fill:#fff;stroke:#2e747b;stroke-width:2.5}.io{fill:#fff;stroke:#2e747b;stroke-width:2.5}.dec{fill:#fff;stroke:#61727c;stroke-width:2.5}
  </style>
</defs>
<rect width="1300" height="1280" fill="#fff"/>
<text x="650" y="46" text-anchor="middle" class="t title">Diagrama de flujo · Check-in</text>
<text x="650" y="75" text-anchor="middle" class="t sub">Flujo principal del proceso de ingreso y asignación de habitación</text>

<rect x="500" y="110" width="300" height="68" rx="34" class="term"/>
<text x="650" y="153" text-anchor="middle" class="t label">Inicio</text>
<line x1="650" y1="178" x2="650" y2="230" class="line"/>

<polygon points="485,230 835,230 805,325 455,325" class="io"/>
<text x="645" y="274" text-anchor="middle" class="t label">Ingresar datos del huésped</text>
<text x="645" y="300" text-anchor="middle" class="t small">para iniciar el check-in</text>
<line x1="650" y1="325" x2="650" y2="380" class="line"/>

<polygon points="650,380 830,465 650,550 470,465" class="dec"/>
<text x="650" y="472" text-anchor="middle" class="t label">¿Datos completos?</text>

<!-- NO LOOP -->
<path d="M830 465 H1015 V275 H835" class="line"/>
<text x="865" y="445" class="t small">No</text>

<!-- YES -->
<line x1="650" y1="550" x2="650" y2="610" class="line"/>
<text x="675" y="585" class="t small">Sí</text>

<rect x="460" y="610" width="380" height="86" rx="10" class="proc"/>
<text x="650" y="646" text-anchor="middle" class="t label">Consultar disponibilidad</text>
<text x="650" y="674" text-anchor="middle" class="t small">de habitaciones</text>
<line x1="650" y1="696" x2="650" y2="752" class="line"/>

<polygon points="650,752 845,840 650,928 455,840" class="dec"/>
<text x="650" y="833" text-anchor="middle" class="t label">¿Hay habitación</text>
<text x="650" y="860" text-anchor="middle" class="t label">disponible?</text>

<!-- NO RIGHT -->
<line x1="845" y1="840" x2="940" y2="840" class="line"/>
<text x="875" y="820" class="t small">No</text>
<rect x="940" y="798" width="300" height="84" rx="10" class="proc"/>
<text x="1090" y="834" text-anchor="middle" class="t small">Informar que no hay</text>
<text x="1090" y="859" text-anchor="middle" class="t small">disponibilidad</text>
<line x1="1090" y1="882" x2="1090" y2="965" class="line"/>
<rect x="990" y="965" width="200" height="62" rx="31" class="term"/>
<text x="1090" y="1004" text-anchor="middle" class="t label">Fin</text>

<!-- YES DOWN -->
<line x1="650" y1="928" x2="650" y2="980" class="line"/>
<text x="675" y="958" class="t small">Sí</text>

<rect x="490" y="980" width="320" height="76" rx="10" class="proc"/>
<text x="650" y="1027" text-anchor="middle" class="t label">Asignar habitación</text>
<line x1="650" y1="1056" x2="650" y2="1108" class="line"/>

<rect x="445" y="1108" width="410" height="82" rx="10" class="proc"/>
<text x="650" y="1143" text-anchor="middle" class="t label">Registrar check-in</text>
<text x="650" y="1170" text-anchor="middle" class="t small">y marcar la habitación como ocupada</text>
<line x1="650" y1="1190" x2="650" y2="1220" class="line"/>

<rect x="550" y="1210" width="200" height="56" rx="28" class="term"/>
<text x="650" y="1246" text-anchor="middle" class="t label">Fin</text>
</svg>