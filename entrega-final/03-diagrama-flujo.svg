<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1180" viewBox="0 0 760 1180">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
    <path d="M0,0 L0,8 L10,4 z" fill="#202020"/>
  </marker>
  <style>
    .txt{font-family:Arial,sans-serif;fill:#222;font-size:24px}
    .small{font-family:Arial,sans-serif;fill:#444;font-size:20px}
    .line{stroke:#202020;stroke-width:5;fill:none;marker-end:url(#arrow)}
    .term{fill:#fff;stroke:#ff7777;stroke-width:5}
    .io{fill:#fff;stroke:#32b7b2;stroke-width:5}
    .proc{fill:#fff;stroke:#32b7b2;stroke-width:5}
    .dec{fill:#fff;stroke:#555;stroke-width:5}
  </style>
</defs>
<rect width="760" height="1180" fill="white"/>

<rect x="250" y="30" width="260" height="78" rx="39" class="term"/>
<text x="380" y="80" text-anchor="middle" class="txt">Inicio</text>

<path d="M380 108 L380 165" class="line"/>
<polygon points="240,165 545,165 510,260 205,260" class="io"/>
<text x="375" y="207" text-anchor="middle" class="txt">Ingresar datos</text>
<text x="375" y="238" text-anchor="middle" class="txt">del huésped</text>

<path d="M380 260 L380 325" class="line"/>
<polygon points="380,325 545,405 380,485 215,405" class="dec"/>
<text x="380" y="397" text-anchor="middle" class="txt">¿Datos</text>
<text x="380" y="430" text-anchor="middle" class="txt">completos?</text>

<path d="M545 405 L650 405 L650 205 L545 205" class="line"/>
<text x="665" y="315" class="small">No</text>
<path d="M380 485 L380 545" class="line"/>
<text x="405" y="525" class="small">Sí</text>

<rect x="225" y="545" width="310" height="82" class="proc"/>
<text x="380" y="580" text-anchor="middle" class="txt">Consultar habitación</text>
<text x="380" y="612" text-anchor="middle" class="txt">disponible</text>

<path d="M380 627 L380 685" class="line"/>
<polygon points="380,685 550,765 380,845 210,765" class="dec"/>
<text x="380" y="755" text-anchor="middle" class="txt">¿Hay habitación</text>
<text x="380" y="788" text-anchor="middle" class="txt">disponible?</text>

<path d="M550 765 L665 765 L665 925 L555 925" class="line"/>
<text x="675" y="805" class="small">No</text>
<rect x="385" y="885" width="270" height="80" class="proc"/>
<text x="520" y="917" text-anchor="middle" class="small">Informar que no hay</text>
<text x="520" y="946" text-anchor="middle" class="small">disponibilidad</text>

<path d="M380 845 L380 900" class="line"/>
<text x="405" y="878" class="small">Sí</text>
<rect x="105" y="900" width="250" height="72" class="proc"/>
<text x="230" y="945" text-anchor="middle" class="txt">Asignar habitación</text>

<path d="M230 972 L230 1020" class="line"/>
<rect x="80" y="1020" width="300" height="78" class="proc"/>
<text x="230" y="1052" text-anchor="middle" class="small">Registrar check-in</text>
<text x="230" y="1080" text-anchor="middle" class="small">y ocupación en la BD</text>

<path d="M230 1098 L230 1130" class="line"/>
<rect x="135" y="1130" width="190" height="38" rx="19" class="term"/>
<text x="230" y="1156" text-anchor="middle" class="small">Fin</text>

<path d="M520 965 L520 1130 L325 1130" class="line"/>
</svg>