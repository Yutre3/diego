<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#26343d}.title{font-size:28px;font-weight:700}.h{font-size:17px;font-weight:700}.f{font-size:14px}.small{font-size:12px}.tiny{font-size:11px}
.box{fill:#ffffff;stroke:#616161;stroke-width:1.8}.field{fill:#ffffff;stroke:#616161;stroke-width:1.4}
</style></defs>
<rect width="1500" height="1020" fill="#fffdfa"/>
<text x="750" y="40" text-anchor="middle" class="t title">Sketch · Reservas</text>

<rect x="55" y="70" width="1390" height="900" rx="0" fill="#fffdfa" stroke="#616161" stroke-width="2" stroke-dasharray="7 6"/>

<!-- Encabezado -->
<rect x="80" y="95" width="1340" height="76" rx="0" fill="#ffffff" stroke="#616161" stroke-width="1.8" stroke-dasharray="7 6"/>
