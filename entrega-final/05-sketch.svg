<rect x="1015" y="586" width="345" height="34" rx="0" class="field" stroke-dasharray="7 6"/>
<text x="1015" y="646" class="t small">Habitación</text>
<rect x="1015" y="654" width="345" height="34" rx="0" class="field" stroke-dasharray="7 6"/>

<text x="1015" y="713" class="t tiny">Entrada</text>
<rect x="1015" y="720" width="100" height="32" rx="0" class="field" stroke-dasharray="7 6"/>
