<rect x="1242" y="720" width="118" height="32" rx="0" class="field" stroke-dasharray="7 6"/>

<rect x="1015" y="760" width="345" height="0" fill="none"/>
<rect x="1015" y="752" width="345" height="0" fill="none"/>
